<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>CBG Karnal — Data Entry Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"/>
  <style>
    :root{
      --bg:#f0f2f8;--surface:#fff;--border:#dde1ec;--text:#1a1d2e;
      --muted:#6b7280;--accent:#1c52a3;--accent2:#2563eb;
      --calc:#92400e;--calc-bg:#fffbeb;
      --success:#16a34a;--danger:#dc2626;
      --warn-bg:#fef3c7;--warn-text:#92400e;
      --radius:8px;--hh:54px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:#f5f5f6;color:#18181b;font-size:14px;height:100vh;overflow:hidden;}

    /* ══ APP SHELL ══ */
    .app{display:flex;height:100vh;width:100%}

    /* ══ SIDEBAR ══ */
    .sidebar{width:222px;background:#fff;border-right:1px solid #e4e4e7;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
    .sb-brand{padding:14px 14px 11px;border-bottom:1px solid #f4f4f5;display:flex;align-items:center;gap:10px;flex-shrink:0}
    .sb-logo{width:34px;height:34px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(79,70,229,.25)}
    .sb-plant{font-size:13.5px;font-weight:700;color:#18181b;letter-spacing:-.02em}
    .sb-loc{font-size:11px;color:#a1a1aa;margin-top:1px}
    .sb-home{margin:9px 9px 3px;border-radius:10px;background:#f4f4f5;border:1px solid #e4e4e7;padding:7px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0;transition:background .13s}
    .sb-home:hover{background:#ececec}
    .sb-home-icon{width:23px;height:23px;background:#18181b;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:13px}
    .sb-home-label{font-size:12.5px;font-weight:600;color:#18181b;flex:1}
    .sb-upl{margin:3px 9px 3px;border-radius:10px;background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:1px solid #c7d2fe;padding:7px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0}
    .sb-upl:hover{background:linear-gradient(135deg,#e0e7ff,#ede9fe)}
    .sb-upl-icon{width:23px;height:23px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:12px;font-weight:700}
    .sb-upl-label{font-size:12.5px;font-weight:600;color:#4338ca;flex:1}
    .sb-upl-badge{background:#4f46e5;color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:99px}
    .sb-sec{padding:11px 13px 4px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#9ca3af;flex-shrink:0}
    .date-pills{padding:0 9px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
    .dp{padding:7px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:all .13s}
    .dp:hover{background:#fafafa}
    .dp.active{background:#f0f0ff;border-color:#c7d2fe}
    .dp-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
    .dp-date{font-size:12.5px;font-weight:600;color:#3f3f46}
    .dp.active .dp-date{color:#4f46e5}
    .dp-pct{font-size:11px;font-weight:700}
    .dp-bar{height:4px;background:#f0eeee;border-radius:99px;overflow:hidden}
    .dp-fill{height:100%;border-radius:99px;transition:width .3s}
    .sb-divider{height:1px;background:#f4f4f5;margin:9px 9px;flex-shrink:0}
    .sb-summary{padding:0 10px;display:flex;align-items:center;gap:10px;flex-shrink:0}
    .sb-ring{position:relative;width:46px;height:46px;flex-shrink:0}
    .sb-ring svg{transform:rotate(-90deg)}
    .sb-ring-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#18181b}
    .sb-sum-info{flex:1}
    .sb-sum-v{font-size:15px;font-weight:900;color:#18181b;letter-spacing:-.03em;line-height:1}
    .sb-sum-l{font-size:11px;color:#a1a1aa;margin-top:2px}
    .sb-alert{margin:0 9px;background:#fef2f2;border:1px solid #fecaca;border-radius:9px;padding:8px 10px;flex-shrink:0}
    .sb-alert-title{font-size:11.5px;font-weight:700;color:#b91c1c;margin-bottom:5px}
    .sb-alert-item{display:flex;align-items:center;gap:6px;padding:2px 0}
    .sb-alert-dot{width:5px;height:5px;border-radius:50%;background:#ef4444;flex-shrink:0}
    .sb-alert-text{font-size:11.5px;color:#7f1d1d}
    .sb-audit-btn{margin:6px 9px 0;background:#4f46e5;color:#fff;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;text-align:center;box-shadow:0 2px 8px rgba(79,70,229,.25);border:none;font-family:inherit;width:calc(100% - 18px);display:block;flex-shrink:0}
    .sb-foot{margin-top:auto;padding:10px 12px;border-top:1px solid #f4f4f5;display:flex;align-items:center;gap:9px;flex-shrink:0}
    .sb-av{width:27px;height:27px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;flex-shrink:0;position:relative}
    .sb-av::after{content:'';position:absolute;bottom:0;right:0;width:8px;height:8px;background:#22c55e;border-radius:50%;border:1.5px solid #fff}
    .sb-un{font-size:12.5px;font-weight:600;color:#18181b}
    .sb-role{font-size:11px;color:#a1a1aa}

    /* ══ MAIN AREA ══ */
    .main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .topbar{height:48px;background:#fff;border-bottom:1px solid #e4e4e7;padding:0 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
    .tb-live{display:flex;align-items:center;gap:6px;padding:4px 11px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:99px}
    .tb-pulse{width:7px;height:7px;border-radius:50%;background:#16a34a;animation:blink 2s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
    .tb-ltext{font-size:12px;font-weight:700;color:#15803d;letter-spacing:.04em}
    .tb-sp{flex:1}
    .tb-date{font-size:12px;color:#a1a1aa}
    .tb-date strong{color:#52525b;font-weight:600}
    .tb-btn{padding:6px 15px;background:#4f46e5;color:#fff;border:none;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
    .tb-btn.signed{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
    .main-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
    main{flex:1;overflow-y:auto;padding:16px 20px;}
    .sh{margin-bottom:12px;}
    .sh h2{font-size:1.1rem;font-weight:700;}
    .sh .sub{font-size:.87rem;color:var(--muted);margin-top:2px;}
    .date-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;
      padding:9px 13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
    .date-row label{font-size:.79rem;font-weight:600;}
    .date-row input[type="date"]{padding:5px 8px;border:1px solid var(--border);border-radius:6px;
      background:var(--bg);color:var(--text);font-size:.85rem;}
    .sec{margin-bottom:20px;}
    .sec-title-row{display:flex;align-items:center;justify-content:space-between;padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:11px;}
    .sec-title{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
    .clear-btn{font-size:.65rem;font-weight:600;color:var(--danger);background:none;border:1px solid var(--danger);
      border-radius:4px;padding:2px 8px;cursor:pointer;opacity:.7;transition:opacity .15s;}
    .clear-btn:hover{opacity:1;}
    .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px;}
    .fg{display:flex;flex-direction:column;gap:3px;}
    .fg label{font-size:.8rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:4px;}
    .atag{font-size:.62rem;color:var(--calc);font-weight:700;letter-spacing:.04em;
      text-transform:uppercase;background:var(--calc-bg);padding:1px 4px;border-radius:3px;}
    .fg input,.fg select,.fg textarea{padding:6px 8px;border:1px solid var(--border);border-radius:6px;
      background:var(--surface);color:var(--text);font-size:.94rem;
      font-variant-numeric:tabular-nums;transition:border-color .15s;width:100%;}
    .fg input:focus,.fg select:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
    .fg input.cf{background:var(--calc-bg);color:var(--calc);font-weight:600;border-color:transparent;cursor:default;}
    .fg textarea{resize:vertical;min-height:56px;}
    .info-row{grid-column:1/-1;color:var(--muted);font-size:.78rem;font-style:italic;padding:3px 0;}
    .save-bar{padding:9px 20px;background:var(--surface);border-top:1px solid var(--border);
      display:flex;align-items:center;gap:12px;}
    #saveBtn{padding:7px 22px;border:none;border-radius:6px;background:var(--accent);
      color:#fff;cursor:pointer;font-size:.87rem;font-weight:600;}
    #saveBtn:disabled{opacity:.4;cursor:not-allowed;}
    #saveNote{font-size:.77rem;color:var(--muted);}
    #toast{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:var(--radius);
      background:var(--success);color:#fff;font-size:.85rem;font-weight:500;
      box-shadow:0 4px 14px rgba(0,0,0,.2);display:none;z-index:999;}
    #toast.err{background:var(--danger);}
    /* ── Home / Audit views ─────────────────────────────── */
    .hero{border-radius:14px;overflow:hidden;position:relative;background:#fff;border:1px solid #e4e4e7;box-shadow:0 1px 4px rgba(0,0,0,.04);flex-shrink:0}
    .hero-grad{position:absolute;top:0;right:0;width:55%;height:100%;background:linear-gradient(135deg,#eef2ff 0%,#f5f3ff 55%,#fdf4ff 100%);clip-path:polygon(10% 0,100% 0,100% 100%,0% 100%)}
    .hero-inner{position:relative;z-index:1;padding:22px 26px;display:flex;align-items:center;gap:20px}
    .hero-left{flex:1}
    .hero-tag{display:inline-block;margin-bottom:9px;background:#f0f0ff;border:1px solid #c7d2fe;padding:3px 11px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#4338ca}
    .hero-h1{font-size:24px;font-weight:900;color:#18181b;letter-spacing:-.04em;line-height:1.08;margin-bottom:7px}
    .hero-h1 em{font-style:normal;background:linear-gradient(135deg,#4f46e5,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .hero-sub{font-size:13px;color:#71717a;line-height:1.7;max-width:310px;margin-bottom:12px}
    .hero-btns{display:flex;gap:8px}
    .h-btn-p{padding:8px 18px;background:#4f46e5;color:#fff;border:none;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 3px 10px rgba(79,70,229,.28)}
    .h-btn-s{padding:8px 15px;background:#fff;color:#52525b;border:1px solid #e4e4e7;border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit}
    .hero-right{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex-shrink:0;width:220px}
    .hstat{background:#fff;border:1px solid #e4e4e7;border-radius:10px;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.04);position:relative;overflow:hidden}
    .hstat::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;border-radius:10px 10px 0 0}
    .c1::before{background:linear-gradient(90deg,#4f46e5,#7c3aed)}
    .c2::before{background:linear-gradient(90deg,#10b981,#34d399)}
    .c3::before{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
    .c4::before{background:linear-gradient(90deg,#ef4444,#f87171)}
    .hv{font-size:18px;font-weight:900;color:#18181b;letter-spacing:-.04em;line-height:1}
    .hu{font-size:8px;color:#a1a1aa;margin-left:1px}
    .hl{font-size:9px;color:#a1a1aa;margin-top:3px}
    .hs{font-size:9px;font-weight:600;margin-top:2px}
    .sec-hd{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .sec-hd-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#a1a1aa}
    .wb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex-shrink:0}
    .wcard{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e4e4e7;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer;transition:box-shadow .15s,transform .12s}
    .wcard:hover{box-shadow:0 6px 20px rgba(0,0,0,.09);transform:translateY(-2px)}
    .wc-head{padding:11px 13px 9px;position:relative;overflow:hidden}
    .wc-mesh{position:absolute;inset:0;opacity:.07;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,1) 0px,transparent 1px,transparent 8px,rgba(255,255,255,1) 9px)}
    .wc-hi{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between}
    .wc-lbl{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.82);margin-bottom:2px}
    .wc-name{font-size:13.5px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.1}
    .wc-cnt{font-size:10.5px;color:rgba(255,255,255,.78);margin-top:2px}
    .wc-rw{text-align:center;flex-shrink:0}
    .wc-ring{width:32px;height:32px}
    .wc-pct{font-size:9.5px;font-weight:900;color:#fff;margin-top:1px}
    .wc-body{padding:2px 0}
    .ws{display:flex;align-items:center;gap:7px;padding:5px 12px;border-bottom:1px solid #fafafa;transition:background .1s;cursor:pointer}
    .ws:last-child{border-bottom:none}
    .ws:hover{background:#fafafa}
    .ws-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
    .ws-name{font-size:12px;color:#3f3f46;flex:1;font-weight:500}
    .ws-pill{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;flex-shrink:0}
    .ws-go{font-size:12px;font-weight:700;color:#a1a1aa;margin-left:2px}
    .ws:hover .ws-go{color:#4f46e5}
    .wc-foot{height:3px}
    .bottom-row{display:grid;grid-template-columns:1fr 200px;gap:11px;flex-shrink:0}
    .panel{background:#fff;border:1px solid #e4e4e7;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.03)}
    .panel-head{padding:9px 13px;border-bottom:1px solid #f4f4f5;display:flex;align-items:center;justify-content:space-between}
    .panel-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#a1a1aa}
    .ai{padding:7px 12px;display:flex;align-items:center;gap:9px;border-bottom:1px solid #fafafa}
    .ai:last-child{border-bottom:none}
    .ai-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0}
    .ai-body{flex:1;min-width:0}
    .ai-text{font-size:12px;color:#71717a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ai-text strong{color:#18181b;font-weight:600}
    .ai-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;flex-shrink:0}
    .ai-time{font-size:11px;color:#a1a1aa;white-space:nowrap;flex-shrink:0}
    .prog-body{display:flex;flex-direction:column;align-items:center;padding:10px 10px;gap:8px}
    .ring-wrap{position:relative;width:80px;height:80px;flex-shrink:0}
    .ring-wrap svg{transform:rotate(-90deg)}
    .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .ring-pct{font-size:22px;font-weight:900;color:#18181b;letter-spacing:-.04em;line-height:1}
    .ring-lbl{font-size:8.5px;color:#a1a1aa;margin-top:2px;letter-spacing:.06em;text-transform:uppercase}
    .prog-list{width:100%;display:flex;flex-direction:column;gap:5px}
    .pi{display:flex;align-items:center;gap:7px}
    .pi-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
    .pi-name{font-size:10px;color:#71717a;flex:1}
    .pi-badge{font-size:9px;font-weight:600;padding:2px 6px;border-radius:4px}
    /* AUDIT */
    .audit-header{background:#fff;border:1px solid #e4e4e7;border-radius:13px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 3px rgba(0,0,0,.03);flex-shrink:0}
    .ah-tag{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#4338ca;background:#f0f0ff;border:1px solid #c7d2fe;padding:3px 10px;border-radius:99px;display:inline-block;margin-bottom:7px}
    .ah-title{font-size:19px;font-weight:900;color:#18181b;letter-spacing:-.04em}
    .ah-sub{font-size:11.5px;color:#71717a;margin-top:3px}
    .ah-stats{display:flex;gap:16px}
    .ah-stat{text-align:center}
    .ah-stat-v{font-size:20px;font-weight:900;letter-spacing:-.04em}
    .ah-stat-l{font-size:9.5px;color:#a1a1aa;margin-top:2px}
    .audit-tabs-row{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .audit-tabs{display:flex;gap:4px}
    .atab{padding:5px 13px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid transparent}
    .atab.on{background:#fff;border-color:#e4e4e7;color:#4f46e5;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .atab.off{color:#a1a1aa;background:transparent}
    .matrix{background:#fff;border:1px solid #e4e4e7;border-radius:13px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.03)}
    .mh-row{display:grid;background:#f9f9fb;border-bottom:1px solid #f0f0f0}
    .mh{padding:8px 12px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#a1a1aa;text-align:center}
    .mh:first-child{text-align:left}
    .mr{display:grid;border-bottom:1px solid #f0f0f0;align-items:center}
    .wb-row:hover{background:#f9f9ff}
    .mr-sheet{border-bottom:1px solid #f4f4f4}
    .mr-name{padding:9px 12px;display:flex;align-items:center;gap:8px}
    .mr-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
    .mr-label{font-size:12.5px;font-weight:600;color:#3f3f46}
    .mr-cell{padding:6px 8px;display:flex;align-items:center;justify-content:center}
    .cell{width:100%;padding:5px 7px;border-radius:7px;font-size:11.5px;font-weight:700;text-align:center;cursor:pointer;transition:all .13s;border:1px solid transparent}
    .cell:hover{filter:brightness(.95)}
    .done{background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}
    .pend{background:#fffbeb;color:#b45309;border-color:#fde68a}
    .miss{background:#fef2f2;color:#b91c1c;border-color:#fecaca;animation:missflash 2s infinite}
    @keyframes missflash{0%,100%{opacity:1}50%{opacity:.6}}
    .legend-row{display:flex;gap:12px;padding:8px 12px;background:#fafafa;border-top:1px solid #f0f0f0}
    .leg{display:flex;align-items:center;gap:5px;font-size:10px;color:#71717a}
    .leg-sq{width:10px;height:10px;border-radius:3px}
    /* HOME VIEW scroll container */
    .home-scroll{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:13px}
    .home-scroll::-webkit-scrollbar{width:3px}
    .home-scroll::-webkit-scrollbar-thumb{background:#e4e4e7;border-radius:4px}
    /* SHEET VIEW */
    .sheet-view{display:flex;flex-direction:column;flex:1;overflow:hidden}
    .sh{margin-bottom:12px;}
    .sh h2{font-size:1.1rem;font-weight:700;}
    .sh .sub{font-size:.87rem;color:var(--muted);margin-top:2px;}
    .date-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;
      padding:9px 13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
    .date-row label{font-size:.79rem;font-weight:600;}
    .date-row input[type="date"]{padding:5px 8px;border:1px solid var(--border);border-radius:6px;

// Always append T00:00:00 — prevents UTC midnight from shifting to previous day in IST
function getMonth(ds){ return ds ? new Date(ds + 'T00:00:00').getMonth()+1 : new Date().getMonth()+1 }

// Returns true only for real calendar dates (blocks Feb 30, Apr 31, etc.)
function isValidDate(ds){
  if(!ds) return false
  const d = new Date(ds + 'T00:00:00')
  if(isNaN(d)) return false
  const [y,m,day] = ds.split('-').map(Number)
  return d.getFullYear()===y && d.getMonth()+1===m && d.getDate()===day
}

// Format YYYY-MM-DD → DD-MM-YYYY for display
function fmtDisplay(ds){ if(!ds) return ''; const [y,m,d]=ds.split('-'); return `${d}-${m}-${y}` }

// Convert YYYY-MM-DD → Excel serial number (locale-proof integer for writing to Excel)
// Excel epoch = Dec 30 1899 (Lotus leap-year bug offset)
// Example: 2026-09-14 → 46088
// Always use this when building the rowData date column — never send a date string.
function toExcelSerial(ds){
  const d     = new Date(ds + 'T00:00:00')
  const epoch = new Date('1899-12-30T00:00:00')
  return Math.round((d - epoch) / 86400000)
}

// Sanity-check: convert Excel serial back to YYYY-MM-DD (used in save verification)
function fromExcelSerial(n){
  const d = new Date(new Date('1899-12-30T00:00:00').getTime() + n * 86400000)
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
}
function n(v){ return parseFloat(v)||0 }

const FN = {
  // BPP
  bpp_cd:    (v,m) => n(v.cd_act)*45,
  bpp_pm:    (v,m) => n(v.pm_act)*(PM_BPP[m]||95),
  bpp_gs:    (v,m) => n(v.gs_act)*220,
  bpp_csl:   (v,m) => n(v.csl_act)*270,
  bpp_sg:    (v,m) => n(v.sg_act)*130,
  bpp_ap:    (v,m) => n(v.ap_act)*100,
  tot_bpp:   (v,m) => n(v.cd_act)*45 + n(v.pm_act)*(PM_BPP[m]||95) + n(v.gs_act)*220 + n(v.csl_act)*270 + n(v.sg_act)*130 + n(v.ap_act)*100,

  // TS tonnes
  cd_ts_t:   (v) => n(v.cd_act)  * (n(v.cd_ts)/100),
  pm_ts_t:   (v) => n(v.pm_act)  * (n(v.pm_ts)/100),
  gs_ts_t:   (v) => n(v.gs_act)  * DENSITY.GS  * (n(v.gs_ts)/100),
  csl_ts_t:  (v) => n(v.csl_act) * DENSITY.CSL * (n(v.csl_ts)/100),

  // VS tonnes
  cd_vs_t:   (v) => n(v.cd_act)  * (n(v.cd_ts)/100) * (n(v.cd_vs)/100),
  pm_vs_t:   (v) => n(v.pm_act)  * (n(v.pm_ts)/100) * (n(v.pm_vs)/100),
  gs_vs_t:   (v) => n(v.gs_act)  * DENSITY.GS  * (n(v.gs_ts)/100) * (n(v.gs_vs)/100),
  csl_vs_t:  (v) => n(v.csl_act) * DENSITY.CSL * (n(v.csl_ts)/100) * (n(v.csl_vs)/100),

  // Total VS kg
  tot_vs_kg: (v) => {
    const cd  = n(v.cd_act)  * (n(v.cd_ts)/100)  * (n(v.cd_vs)/100)
    const pm  = n(v.pm_act)  * (n(v.pm_ts)/100)  * (n(v.pm_vs)/100)
    const gs  = n(v.gs_act)  * DENSITY.GS  * (n(v.gs_ts)/100) * (n(v.gs_vs)/100)
    const csl = n(v.csl_act) * DENSITY.CSL * (n(v.csl_ts)/100)* (n(v.csl_vs)/100)
    return (cd+pm+gs+csl)*1000
  },

  // Digester performance
  wv: (v,m) => {
    const h = n(v.sl_ht)>0 ? n(v.sl_ht) : ([1,2,3].includes(m)?H.winter:H.other)
    return Math.PI*RADIUS*RADIUS*h
  },
  olr: (v,m) => {
    const wv = Math.PI*RADIUS*RADIUS*(n(v.sl_ht)>0?n(v.sl_ht):([1,2,3].includes(m)?H.winter:H.other))
    const cd  = n(v.cd_act)  * (n(v.cd_ts)/100)  * (n(v.cd_vs)/100)
    const pm  = n(v.pm_act)  * (n(v.pm_ts)/100)  * (n(v.pm_vs)/100)
    const gs  = n(v.gs_act)  * DENSITY.GS  * (n(v.gs_ts)/100) * (n(v.gs_vs)/100)
    const csl = n(v.csl_act) * DENSITY.CSL * (n(v.csl_ts)/100)* (n(v.csl_vs)/100)
    const vs_kg = (cd+pm+gs+csl)*1000
    return wv>0 ? vs_kg/wv : null
  },
  psa_eff:   (v) => n(v.psa_hrs)>0 ? (n(v.cbg_prod)/(n(v.psa_hrs)*PSA_BASIS))*100 : null,
  dig_eff:   (v,m) => {
    const bpp = n(v.cd_act)*45 + n(v.pm_act)*(PM_BPP[m]||95) + n(v.gs_act)*220 + n(v.csl_act)*270
    return (bpp>0 && n(v.rbg_psa)>0) ? (n(v.rbg_psa)/bpp)*100 : null
  },

  // BPP day-wise (30/40/30 for CD & PM; 100% for GS & CSL)
  bpp_d0: (v,m) => (n(v.cd_act)*45*0.3) + (n(v.pm_act)*(PM_BPP[m]||95)*0.3) + n(v.gs_act)*220 + n(v.csl_act)*270,
  bpp_d1: (v,m) => (n(v.cd_act)*45*0.4) + (n(v.pm_act)*(PM_BPP[m]||95)*0.4),
  bpp_d2: (v,m) => (n(v.cd_act)*45*0.3) + (n(v.pm_act)*(PM_BPP[m]||95)*0.3),

  // PSA
  // Cal sheets: TS Tonnes = Qty Fed × (TS%/100); VS Tonnes = TS Tonnes × VS_factor
  // VS% stored as fraction (<2) for PMCAL, as percentage for CDCAL/GSCAL/CSLCAL
  cal_ts_t: (v) => n(v.qty)>0 && n(v.ts_pct)>0 ? Math.round(n(v.qty)*(n(v.ts_pct)/100)*10000)/10000 : null,
  cal_vs_t: (v) => { const vs=n(v.vs_pct); const f=vs<2?vs:vs/100; return n(v.ts_t)>0 ? Math.round(n(v.ts_t)*f*10000)/10000 : null },

  psa_comp_diff:(v) => Math.round((n(v.psa_hrs)-n(v.comp_hrs))*60),  // diff in minutes
  rbg_total:    (v) => n(v.rbg_d1)+n(v.rbg_d2),
  cbg_tot:      (v) => n(v.cbg_d1)+n(v.cbg_d2),
  tot_disp:     (v) => n(v.veer_kg)+n(v.adinath_kg)+n(v.gail_kg)+n(v.sps_kg)+n(v.other1_kg)+n(v.other2_kg),
  ideal_rbg:    (v) => n(v.psa_hrs)*600,
  ideal_pur:    (v) => n(v.psa_hrs)*370,
  ideal_cbg:    (v) => n(v.psa_hrs)*275,
  psa_eff_psa:  (v) => n(v.psa_hrs)>0 ? ((n(v.cbg_d1)+n(v.cbg_d2))/(n(v.psa_hrs)*PSA_BASIS))*100 : null,

  // IA-PA — TA = IA+PA; ratio = IA÷PA (written to sheet cols 5,9,13,17)
  d1_ta1:    (v) => n(v.d1_pa1)+n(v.d1_ia1),
  d1_ta2:    (v) => n(v.d1_pa2)+n(v.d1_ia2),
  d2_ta1:    (v) => n(v.d2_pa1)+n(v.d2_ia1),
  d2_ta2:    (v) => n(v.d2_pa2)+n(v.d2_ia2),
  d1_iapa1:  (v) => n(v.d1_pa1)>0 ? n(v.d1_ia1)/n(v.d1_pa1) : null,
  d1_iapa2:  (v) => n(v.d1_pa2)>0 ? n(v.d1_ia2)/n(v.d1_pa2) : null,
  d2_iapa1:  (v) => n(v.d2_pa1)>0 ? n(v.d2_ia1)/n(v.d2_pa1) : null,
  d2_iapa2:  (v) => n(v.d2_pa2)>0 ? n(v.d2_ia2)/n(v.d2_pa2) : null,

  // Feedstock Supply totals
  pw_total:    (v) => n(v.pw_lather)+n(v.pw_narwal)+n(v.pw_subhash)+n(v.pw_gk)+n(v.pw_dry)+n(v.pw_nazim),
  cd_total:    (v) => n(v.cd_gharaunda)+n(v.cd_phoosgarh)+n(v.cd_radhakrishna),
  csl_total:   (v) => n(v.csl_sadasat)+n(v.csl_pantnagar)+n(v.csl_virangam),
  pm_total:    (v) => n(v.pm_sonipat)+n(v.pm_malakpur)+n(v.pm_ramala)+n(v.pm_thana)+n(v.pm_tikuala)+
                      n(v.pm_shamli)+n(v.pm_laknour)+n(v.pm_balyan)+n(v.pm_singh)+n(v.pm_naveen)+
                      n(v.pm_gs)+n(v.pm_sbec)+n(v.pm_sahakumbri)+n(v.pm_rathi)+n(v.pm_unn)+n(v.pm_devom),
  fs_total_day:(v) => n(v.pw_lather)+n(v.pw_narwal)+n(v.pw_subhash)+n(v.pw_gk)+n(v.pw_dry)+n(v.pw_nazim)+
                      n(v.cd_gharaunda)+n(v.cd_phoosgarh)+n(v.cd_radhakrishna)+
                      n(v.pm_sonipat)+n(v.pm_malakpur)+n(v.pm_ramala)+n(v.pm_thana)+n(v.pm_tikuala)+
                      n(v.pm_shamli)+n(v.pm_laknour)+n(v.pm_balyan)+n(v.pm_singh)+n(v.pm_naveen)+
                      n(v.pm_gs)+n(v.pm_sbec)+n(v.pm_sahakumbri)+n(v.pm_rathi)+n(v.pm_unn)+n(v.pm_devom)+
                      n(v.carlsberg)+n(v.gs_rcv),

  // Feed & Balance
  fb_tot_fed:  (v) => n(v.pm_fed)+n(v.gs_fed)+n(v.csl_fed)+n(v.cd_fed)+n(v.sg_fed)+n(v.ap_fed),

  // Manure: amount = qty_mt × rate (calc, written to col 6)
  manure_amount:(v) => n(v.qty_mt)*n(v.rate),
  // Sales Detail: total dispatched kg and total revenue
  sales_tot_disp:(v) => n(v.veer_qty)+n(v.adinath_qty)+n(v.gail_qty)+n(v.sps_qty),
  // veer_rate/adinath_rate/gail_rate/sps_rate are TOTAL Rs per customer, not rate/kg
  sales_tot_rs:  (v) => n(v.veer_rate)+n(v.adinath_rate)+n(v.gail_rate)+n(v.sps_rate),
}

function runCalcs(sheet, inp, ds){
  const m = getMonth(ds)
  const out = {}
  for(const sec of sheet.sections){
    for(const f of sec.f){
      if(f.tp!=='calc') continue
      const fn = FN[f.fn]
      if(!fn) continue
      const v = fn(inp,m)
      out[f.k] = (v!==null&&v!==undefined) ? (typeof v==='number'?Math.round(v*100)/100:v) : null
    }
  }
  return out
}

    res.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`)
  }
  return res
}

function _savedOnDate(dateStr){
  // returns set of sheet labels saved on dateStr from subLog
  const saved=new Set()
  if(!window._subLog) return saved
  const serial = toExcelSerial(dateStr)
  for(const row of window._subLog){
    if(!row||row.length<2) continue
    const rs=row[0]; const lbl=row[1]
    if(Math.round(Number(rs))===serial&&lbl&&!String(lbl).startsWith('[UPLOAD')) saved.add(lbl)
  }
  return saved
}

  // Sheet save status
  const savedToday=_savedOnDate(dateStr)
  function sheetStatus(id){
    const s=SHEETS.find(x=>x.id===id)
    if(!s) return null
    const saved=savedToday.has(s.label)

    const tracked=ids.filter(id=>SHEETS.find(s=>s.id===id))
    if(!tracked.length) return {pct:0,done:0,total:0}
    const done=tracked.filter(id=>{
      const s=SHEETS.find(x=>x.id===id); return s&&savedToday.has(s.label)

// tracks which workbook rows are expanded in the audit matrix
const _auditExpanded = new Set()

function _auditCellHtml(sheetIds, d, isToday, colTemplate){
  const saved = _savedOnDate(d)
  // only count sheets that exist in SHEETS (tracked or not)
  const knownIds = sheetIds.filter(id => SHEETS.find(s=>s.id===id))
  if(!knownIds.length) return `<div class="mr-cell"><div class="cell" style="color:var(--muted);font-size:.75rem">—</div></div>`
  const savedIds = knownIds.filter(id=>{ const s=SHEETS.find(x=>x.id===id); return s&&saved.has(s.label) })
  const allDone = savedIds.length===knownIds.length
  const noneDone = savedIds.length===0
  const firstId = knownIds[0]
  const click = `onclick="selectPortalDate('${d}');loadSheet('${firstId}')"`
  if(allDone) return `<div class="mr-cell"><div class="cell done" ${click} style="cursor:pointer">Saved ✓</div></div>`
  if(noneDone&&!isToday) return `<div class="mr-cell"><div class="cell miss" ${click} style="cursor:pointer">Missing !</div></div>`
  const lbl = savedIds.length>0 ? `${savedIds.length}/${knownIds.length} done` : 'Pending →'
  return `<div class="mr-cell"><div class="cell pend" ${click} style="cursor:pointer">${lbl}</div></div>`
}

function renderAudit(){
  const main=document.getElementById('main')
  if(!main) return
  const hb=document.getElementById('homeBtn'); if(hb){hb.style.display='flex'}
  document.getElementById('saveBarEl').style.display='none'
  main.style.padding='0'
  cur=null
  const days=_last3Days()
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
  const today=_todayStr()

  function dayLabel(d){
    const dObj=new Date(d+'T00:00:00')
    const dayN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
    const s=`${months[dObj.getMonth()]} ${dObj.getDate()} · ${dayN[dObj.getDay()]}`
    return d===today?s+' (Today)':s
  }

  // Stats: count all sheets across all workbooks (all, not just tracked)
  let totalSaved=0,totalPending=0,totalMissing=0
  days.forEach((d,di)=>{
    const saved=_savedOnDate(d)
    const isToday=d===today
    WB_CARDS.forEach(wb=>{
      wb.ids.forEach(id=>{
        const s=SHEETS.find(x=>x.id===id); if(!s) return
        if(saved.has(s.label)) totalSaved++
        else if(isToday) totalPending++
        else totalMissing++
      })
    })
  })

  const colTemplate=`180px ${days.map(()=>'1fr').join(' ')}`

  const matrixRows=WB_CARDS.map((wb,wi)=>{
    const isExpanded=_auditExpanded.has(wi)
    const arrow=isExpanded?'▾':'▸'

    // Workbook summary row
    const wbCells=days.map(d=>{
      return _auditCellHtml(wb.ids, d, d===today, colTemplate)
    }).join('')

    // Individual sheet rows (shown when expanded)
    const sheetRows=wb.ids.map(id=>{
      const s=SHEETS.find(x=>x.id===id); if(!s) return ''
      const sheetCells=days.map(d=>{
        const saved=_savedOnDate(d)
        const isSaved=saved.has(s.label)
        const isToday=d===today
        const click=`onclick="selectPortalDate('${d}');loadSheet('${id}')"`
        if(isSaved) return `<div class="mr-cell"><div class="cell done" ${click} style="cursor:pointer;font-size:.78rem">Saved ✓</div></div>`
        if(!isToday) return `<div class="mr-cell"><div class="cell miss" ${click} style="cursor:pointer;font-size:.78rem">Missing !</div></div>`
        return `<div class="mr-cell"><div class="cell pend" ${click} style="cursor:pointer;font-size:.78rem">Pending →</div></div>`
      }).join('')
      return `<div class="mr mr-sheet" style="grid-template-columns:${colTemplate};background:var(--bg2,#f8f8fb)">
        <div class="mr-name" style="padding-left:28px;font-size:.82rem;color:var(--fg2,#555)">
          <div class="mr-dot" style="background:${wb.dot};opacity:.5;width:7px;height:7px"></div>
          <span class="mr-label" style="font-weight:500">${s.label}</span>
        </div>
        ${sheetCells}
      </div>`
    }).filter(Boolean).join('')

    // Workbook row: name area opens detail view; date cells also open detail for that date
    const wbDateCells = days.map((d,di) => {
      const saved = _savedOnDate(d)
      const knownIds = wb.ids.filter(id => SHEETS.find(s=>s.id===id))
      if(!knownIds.length) return `<div class="mr-cell"><div class="cell" style="color:var(--muted);font-size:.75rem">—</div></div>`
      const savedIds = knownIds.filter(id=>{ const s=SHEETS.find(x=>x.id===id); return s&&saved.has(s.label) })
      const allDone = savedIds.length===knownIds.length
      const noneDone = savedIds.length===0
      const isToday = d===today
      const click = `onclick="event.stopPropagation();openWbDetail(${wi},'${d}')"`
      if(allDone) return `<div class="mr-cell"><div class="cell done" ${click} style="cursor:pointer">Saved ✓</div></div>`
      if(noneDone&&!isToday) return `<div class="mr-cell"><div class="cell miss" ${click} style="cursor:pointer">Missing !</div></div>`
      const lbl = savedIds.length>0 ? `${savedIds.length}/${knownIds.length} done` : 'Pending →'
      return `<div class="mr-cell"><div class="cell pend" ${click} style="cursor:pointer">${lbl}</div></div>`
    }).join('')

    return `<div class="mr wb-row" style="grid-template-columns:${colTemplate};cursor:pointer" onclick="openWbDetail(${wi})">
      <div class="mr-name">
        <span style="margin-right:6px;font-size:.85rem;color:${wb.dot}">🔍</span>
        <div class="mr-dot" style="background:${wb.dot}"></div>
        <span class="mr-label">${wb.label}</span>
      </div>
      ${wbDateCells}
    </div>
    ${isExpanded ? sheetRows : ''}`
  }).join('')

  main.innerHTML=`<div class="home-scroll">
    <div class="audit-header">
      <div>
        <div class="ah-tag">3-Day Data Audit</div>
        <div class="ah-title">${dayLabel(days[0]).split(' · ')[0]} – ${dayLabel(days[days.length-1]).split(' · ')[0]}</div>
        <div class="ah-sub">Click a workbook row to view all data · Click a date cell to view that date</div>
      </div>
      <div class="ah-stats">
        <div class="ah-stat"><div class="ah-stat-v" style="color:#16a34a">${totalSaved}</div><div class="ah-stat-l">Sheets saved</div></div>
        <div class="ah-stat"><div class="ah-stat-v" style="color:#d97706">${totalPending}</div><div class="ah-stat-l">Pending today</div></div>
        <div class="ah-stat"><div class="ah-stat-v" style="color:#dc2626">${totalMissing}</div><div class="ah-stat-l">Missing</div></div>
      </div>
    </div>
    <div class="audit-tabs-row">
      <div class="audit-tabs">
        <div class="atab on">Matrix view</div>
      </div>
      <span onclick="renderHome()" style="font-size:11px;color:#4f46e5;font-weight:600;cursor:pointer">← Back to home</span>
    </div>
    <div class="matrix">
      <div class="mh-row" style="grid-template-columns:${colTemplate}">
        <div class="mh">Workbook</div>
        ${days.map(d=>`<div class="mh">${dayLabel(d)}</div>`).join('')}
      </div>
      ${matrixRows}
      <div class="legend-row">
        <div class="leg"><div class="leg-sq" style="background:#f0fdf4;border:1px solid #bbf7d0"></div>Saved</div>
        <div class="leg"><div class="leg-sq" style="background:#fffbeb;border:1px solid #fde68a"></div>Pending — click to enter</div>
        <div class="leg"><div class="leg-sq" style="background:#fef2f2;border:1px solid #fecaca"></div>Missing — needs urgent attention</div>
      </div>
    </div>
  </div>`
}

      <span onclick="renderAudit()" style="cursor:pointer;color:#4f46e5;font-size:.82rem;font-weight:600">← Audit Matrix</span>
      <span style="color:var(--muted)">›</span>
      <span style="font-weight:700;font-size:.95rem;color:var(--fg)">${wb.label}</span>
    </div>
    <div style="text-align:center;padding:48px 16px;color:var(--muted)">
      <div style="font-size:1.5rem;margin-bottom:8px">⏳</div>
      <div style="font-size:.88rem">Loading data from SharePoint…</div>
    </div>
  </div>`

  // Auth check
  try{ await initMsal() }catch(e){}
  const t = await getToken().catch(()=>null)
  if(!t){
    main.innerHTML = `<div class="home-scroll" style="padding:20px 16px">
      <span onclick="renderAudit()" style="cursor:pointer;color:#4f46e5;font-size:.82rem;font-weight:600">← Audit Matrix</span>
      <div style="color:#dc2626;padding:20px 0;font-size:.88rem">Not signed in — please sign in to view data.</div>
    </div>`
    return
  }

  const serial = toExcelSerial(selectedDate)
  const APPEND_IDS = new Set(['PMCAL','CDCAL','GSCAL','CSLCAL','SGCAL','APPCAL','MANURE','MAINT'])

  // Open a read-only session: keeps workbook open on Graph's server, eliminates cold-open throttling
  const readSid = await getReadSession()

  // ONE API call per sheet: fetch usedRange and parse everything in JS.
  // This eliminates the multi-call pipeline (header + date-scan + row fetch) that caused 503 throttling.
  const sheetData = {}
  for(const id of wb.ids){
    const sheet = SHEETS.find(s=>s.id===id)
    if(!sheet) continue
    const meta = SHEET_META[id]||{}
    const masterSheet = meta.masterSheet || sheet.sheet || id
    const hrow = meta.hrow||2
    const dataStart = sheet.dataStart||3
    const nameMap = COLUMN_NAME_MAP[id]
    if(!nameMap){ sheetData[id]={rows:[],fields:[]}; continue }

    try{
      const enc = encodeURIComponent(masterSheet)
      // Single call: values only (skip formulas/formats to reduce payload)
      const rangeData = await gGet(`/worksheets('${enc}')/usedRange?$select=values`, readSid)
      const allRows = (rangeData&&rangeData.values)||[]

      // Build header map from hrow (1-based row → 0-based array index)
      const headerRow = allRows[hrow-1]||[]
      const hmap = {}
      headerRow.forEach((v,i)=>{
        if(v===null||v===undefined||v==='') return
        const n=String(v).trim()
        if(!hmap[n]) hmap[n]=[]
        hmap[n].push(i+1) // 1-based col
      })
      // Cache for other callers (portal save etc.)
      _hdrCache[`${masterSheet}:${hrow}`] = hmap

      // Resolve fieldKey → 1-based column index
      const colNums = {}
      for(const [fk,spec] of Object.entries(nameMap)){
        const tildeIdx = spec.lastIndexOf('~')
        let name,occ
        if(tildeIdx>0&&/^\d+$/.test(spec.slice(tildeIdx+1))){ name=spec.slice(0,tildeIdx); occ=parseInt(spec.slice(tildeIdx+1),10) }
        else{ name=spec; occ=1 }
        const cols = hmap[name]
        if(cols&&cols.length>=occ) colNums[fk]=cols[occ-1]
      }

      const dataRows = allRows.slice(dataStart-1) // rows from dataStart onward (0-based)

      function matchesSerial(v){
        if(v===null||v===undefined) return false
        if(typeof v==='number') return Math.round(v)===serial
        if(typeof v==='string'){
          const iso=v.match(/^(\d{4}-\d{2}-\d{2})/); if(iso&&toExcelSerial(iso[1])===serial) return true
          const dmy=v.match(/^(\d{2})-(\d{2})-(\d{4})$/); if(dmy&&toExcelSerial(`${dmy[3]}-${dmy[2]}-${dmy[1]}`)===serial) return true
        }
        return false
      }

      if(APPEND_IDS.has(id)){
        // Append sheet: collect all rows where col B (index 1) matches the date
        const rows = []
        for(const row of dataRows){
          if(!row||row.length===0) continue
          if(matchesSerial(row[1])){ // col B
            const obj={}
            for(const [fk,cn] of Object.entries(colNums)) obj[fk]=row[cn-1]
            rows.push(obj)
          }
        }
        sheetData[id]={rows,fields:Object.keys(nameMap),append:true}
      } else {
        // Date-row sheet: find the single row where col A (index 0) matches the date
        let foundRow=null
        for(const row of dataRows){
          if(!row||row.length===0) continue
          if(matchesSerial(row[0])){ foundRow=row; break }
        }
        if(!foundRow){ sheetData[id]={rows:[],fields:Object.keys(nameMap)}; continue }
        const obj={}
        for(const [fk,cn] of Object.entries(colNums)) obj[fk]=foundRow[cn-1]
        sheetData[id]={rows:[obj],fields:Object.keys(nameMap),append:false}
      }
    }catch(e){
      sheetData[id]={rows:[],fields:Object.keys(nameMap),error:e.message}
    }
  }

  // Format a raw cell value for display
  function fmtVal(v, fk, id){
    if(v===null||v===undefined||v==='') return null
    if(typeof v==='number'){
      // PSA time conversions
      if(id==='PSA'){
        if(fk==='psa_hrs'||fk==='comp_hrs') return (Math.round(v*24*100)/100)+' hrs'
        if(fk==='comp_min') return (Math.round(v*24*60*10)/10)+' min'
        if(fk==='psa_comp_diff') return (Math.round(v*24*60*10)/10)+' min'
      }
      // Excel serial date (large number between ~40000–50000)
      if(v>40000&&v<60000){ const ds=fromExcelSerial(Math.round(v)); return ds||v.toFixed(0) }
      // Small fractions that are likely time values stored /24 — show as is
      if(v>0&&v<1&&id!=='PSA') return v.toFixed(6)
      // Regular numbers
      return Number.isInteger(v)?v.toString():(Math.round(v*1000)/1000).toString()
    }
    return String(v)
  }

  // Get field label from SHEETS definition
  function fieldLabel(fk, id){
    const sheet = SHEETS.find(s=>s.id===id); if(!sheet) return fk
    for(const sec of sheet.sections||[]){
      const f = (sec.f||[]).find(x=>x.k===fk)
      if(f) return f.l
    }
    return fk
  }

  // Render sheet cards
  const sheetCards = wb.ids.map(id=>{
    const sheet = SHEETS.find(s=>s.id===id); if(!sheet) return ''
    const data = sheetData[id]
    if(!data) return ''

    // Build ordered field list from SHEETS sections (preserves section grouping + order)
    const sheetSections = sheet.sections||[]
    const allSheetFields = sheetSections.flatMap(sec=>
      (sec.f||[]).filter(f=>f.tp!=='info'&&f.tp!=='fetch').map(f=>({k:f.k,l:f.l,sec:sec.t}))
    )
    // Fall back to COLUMN_NAME_MAP keys if sheet has no sections defined
    const displayFields = allSheetFields.length > 0 ? allSheetFields : data.fields.map(k=>({k,l:fieldLabel(k,id),sec:null}))

    let content = ''
    if(data.error){
      content = `<div style="color:#dc2626;font-size:.82rem;padding:8px 0">Error: ${data.error}</div>`
    } else if(!data.rows.length){
      // Show all field labels with — so the user can see the full structure
      const emptyCols = displayFields.map(f=>
        `<div style="display:flex;flex-direction:column;gap:2px">
          <div style="font-size:.7rem;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em;line-height:1.2">${f.l}</div>
          <div style="font-size:.88rem;color:var(--muted)">—</div>
        </div>`
      ).join('')
      content = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px 14px">${emptyCols}</div>`
    } else {
      content = data.rows.map((row, ri)=>{
        // Group by section
        let innerHtml = ''
        if(sheetSections.length > 0){
          sheetSections.forEach(sec=>{
            const secFields = (sec.f||[]).filter(f=>f.tp!=='info'&&f.tp!=='fetch')
            if(!secFields.length) return
            const cells = secFields.map(f=>{
              const v = fmtVal(row[f.k], f.k, id)
              const valHtml = v!==null
                ? `<div style="font-size:.88rem;font-weight:600;color:var(--fg)">${v}</div>`
                : `<div style="font-size:.88rem;color:var(--muted)">—</div>`
              return `<div style="display:flex;flex-direction:column;gap:2px">
                <div style="font-size:.7rem;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em;line-height:1.2">${f.l}</div>
                ${valHtml}
              </div>`
            }).join('')
            innerHtml += `<div style="margin-bottom:10px">
              <div style="font-size:.72rem;font-weight:700;color:var(--accent,#4f46e5);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;padding-bottom:3px;border-bottom:1px solid var(--border)">${sec.t}</div>
              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px 14px">${cells}</div>
            </div>`
          })
        } else {
          const cells = displayFields.map(f=>{
            const v = fmtVal(row[f.k], f.k, id)
            const valHtml = v!==null
              ? `<div style="font-size:.88rem;font-weight:600;color:var(--fg)">${v}</div>`
              : `<div style="font-size:.88rem;color:var(--muted)">—</div>`
            return `<div style="display:flex;flex-direction:column;gap:2px">
              <div style="font-size:.7rem;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em;line-height:1.2">${f.l}</div>
              ${valHtml}
            </div>`
          }).join('')
          innerHtml = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px 14px">${cells}</div>`
        }
        const rowHdr = data.rows.length>1 ? `<div style="font-size:.75rem;color:var(--muted);font-weight:600;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid var(--border)">Entry ${ri+1}</div>` : ''
        return `<div style="margin-bottom:${data.rows.length>1?'16px':'0'}">${rowHdr}${innerHtml}</div>`
      }).join('')
    }

    const hasData = data.rows.length>0 && !data.error
    const statusColor = data.error ? '#9333ea' : (hasData ? '#16a34a' : '#dc2626')
    const statusBg = data.error ? '#faf5ff' : (hasData ? '#f0fdf4' : '#fef2f2')
    const statusBorder = data.error ? '#d8b4fe' : (hasData ? '#bbf7d0' : '#fecaca')
    const statusLbl = data.error ? 'Error' : (hasData ? `${data.rows.length} entr${data.rows.length===1?'y':'ies'}` : 'No data')

    return `<div style="background:var(--surface,#fff);border:1px solid var(--border,#e4e4e7);border-radius:12px;padding:14px 16px;margin-bottom:10px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-weight:700;font-size:.9rem;color:var(--fg)">${sheet.label}</div>
        <div style="font-size:.72rem;font-weight:600;color:${statusColor};background:${statusBg};border:1px solid ${statusBorder};padding:2px 8px;border-radius:99px;white-space:nowrap">${statusLbl}</div>
      </div>
      ${content}
    </div>`
  }).filter(Boolean).join('')

  // Date tabs
  const dateTabs = days.map(d=>{
    const active = d===selectedDate
    return `<div onclick="renderWbDetail(${wbIdx},'${d}')" style="padding:6px 14px;border-radius:6px;font-size:.82rem;font-weight:${active?'700':'500'};cursor:pointer;background:${active?wb.dot:'transparent'};color:${active?'#fff':'var(--muted)'};">${dateLabel(d)}</div>`
  }).join('')

  // Build error banner if any sheets failed
  const erroredSheets = wb.ids.filter(id=>sheetData[id]&&sheetData[id].error)
  const errorBanner = erroredSheets.length ? `<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px">
    <div style="font-size:1rem;flex-shrink:0;margin-top:1px">⚠️</div>
    <div>
      <div style="font-weight:700;font-size:.85rem;color:#dc2626;margin-bottom:4px">Failed to load ${erroredSheets.length} sheet${erroredSheets.length>1?'s':''}</div>
      <div style="font-size:.8rem;color:#7f1d1d">${erroredSheets.map(id=>{const s=SHEETS.find(x=>x.id===id);return(s?s.label:id)+': '+sheetData[id].error}).join(' · ')}</div>
      <div style="font-size:.78rem;color:#b91c1c;margin-top:4px">This usually means the Microsoft 365 API is temporarily throttled (503). Try refreshing in 30–60 seconds.</div>
    </div>
  </div>` : ''

  main.innerHTML = `<div class="home-scroll" style="padding:20px 16px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
      <span onclick="renderAudit()" style="cursor:pointer;color:#4f46e5;font-size:.82rem;font-weight:600">← Audit Matrix</span>
      <span style="color:var(--muted)">›</span>
      <span style="font-weight:700;font-size:.92rem;color:var(--fg)">${wb.label}</span>
      <span style="font-size:.75rem;color:var(--muted);background:var(--bg2,#f4f4f8);padding:2px 8px;border-radius:99px;border:1px solid var(--border)">Read Only</span>
    </div>
    <div style="display:flex;gap:4px;margin-bottom:16px;background:var(--bg2,#f4f4f8);border-radius:8px;padding:4px;overflow-x:auto">${dateTabs}</div>
    ${errorBanner}
    ${sheetCards || '<div style="color:var(--muted);text-align:center;padding:40px">No sheets configured for this workbook</div>'}
  </div>`
}
window.renderWbDetail = renderWbDetail

function loadSheet(id){
  const hb=document.getElementById('homeBtn'); if(hb){hb.style.display='flex'}
  // Save current section values before switching
  if(cur) drafts[cur.id]=Object.assign({},inp)
  cur=SHEETS.find(s=>s.id===id)
  // Pre-warm header cache so first Save has no extra latency
  if(cur && SHEET_META[cur.id] && COLUMN_NAME_MAP[cur.id] && typeof gGet==='function'){
    const _m=SHEET_META[cur.id]
    const _specs=Object.values(COLUMN_NAME_MAP[cur.id])
    _specs.forEach(spec=>getColByName(_m.masterSheet,_m.hrow,spec).catch(()=>{}))
  }
  // Restore draft values for this sheet (persist across section switches)
  inp=Object.assign({},drafts[id]||{})
  document.getElementById('saveBarEl').style.display='flex'
  document.getElementById('main').style.padding='16px 20px'
  let html=`<div class="sh"><h2>${cur.label}</h2><div class="sub">Sheet: <b>${cur.sheet}</b></div></div>`
  if(cur.hasDate){
    const _sheetDate=window._activeDateStr||today()
    html+=`<div class="date-row"><label>Date</label>
      <input type="date" id="dp" value="${_sheetDate}" max="2026-12-31" min="2026-01-01" oninput="onDateChange()"/>
      <span id="dp-display" style="font-size:.83rem;font-weight:600;color:var(--accent)">${fmtDisplay(_sheetDate)}</span>
      <span id="dp-err" style="font-size:.77rem;color:#e53935;display:none">Invalid date</span></div>`
  }
  cur.sections.forEach((sec,si)=>{
    html+=`<div class="sec"><div class="sec-title-row"><span class="sec-title">${sec.t}</span><button class="clear-btn" onclick="clearSection('${id}',${si})">Clear</button></div><div class="fgrid">`
    sec.f.forEach(f=>{
      if(f.tp==='info'){
        html+=`<div class="info-row">${f.l}</div>`; return
      }
      const saved=inp[f.k]
      html+=`<div class="fg"><label>${f.l}${f.tp==='calc'?'<span class="atag">auto</span>':''}</label>`
      if(f.tp==='calc'||f.tp==='fetch'){
        html+=`<input type="text" id="f_${f.k}" class="cf" readonly placeholder="—" tabindex="-1"/>`
      } else if(f.tp==='sel'){
        html+=`<select id="f_${f.k}" onchange="onInp('${f.k}',this.value)"><option value="">— select —</option>`
        f.opts.forEach(o=>html+=`<option${saved==o?' selected':''}>${o}</option>`)
        html+=`</select>`
      } else if(f.tp==='txt'){
        html+=`<input type="text" id="f_${f.k}" value="${saved!=null?saved:''}" oninput="onInp('${f.k}',this.value)"/>`
      } else {
        html+=`<input type="number" id="f_${f.k}" step="any" placeholder="0" value="${saved!=null?saved:''}" oninput="onInp('${f.k}',this.value)"/>`
      }
      html+=`</div>`
    })
    html+=`</div></div>`
  })
  document.getElementById('main').innerHTML=html
  recompute()
  if(CAL_QTY_COLS[id]) fetchCalQty(id)
  if(id==='FB') fetchFBPrevBal(window._activeDateStr||today())
  // Load existing data if on a past date (not append sheets)
  const _appendIds2=['PMCAL','GSCAL','CSLCAL','CDCAL','SGCAL','APPCAL','MANURE','MAINT']
  const _loadDate=window._activeDateStr||today()
  if(cur&&cur.hasDate&&!_appendIds2.includes(id)&&COLUMN_NAME_MAP[id]) fetchExistingRow(id,_loadDate)
}

function onInp(k,v){ inp[k]=v===''?null:(isNaN(v)?v:parseFloat(v)); recompute() }
window.onInp=onInp

function clearSection(sheetId,sectionIndex){
  const sheet=SHEETS.find(s=>s.id===sheetId); if(!sheet) return
  const sec=sheet.sections[sectionIndex]; if(!sec) return
  sec.f.forEach(f=>{
    if(f.tp==='calc'||f.tp==='fetch'||f.tp==='info') return
    delete inp[f.k]
    if(drafts[sheetId]) delete drafts[sheetId][f.k]
    const el=document.getElementById('f_'+f.k); if(!el) return
    if(el.tagName==='SELECT') el.value=''
    else el.value=''
  })
  recompute()
}
window.clearSection=clearSection

function recompute(){
  if(!cur) return
  const ds=document.getElementById('dp')?.value
  const calcs=runCalcs(cur,inp,ds)
  for(const [k,v] of Object.entries(calcs)){
    const el=document.getElementById('f_'+k)
    if(el) el.value=v!==null?v:''
  }
}
window.recompute=recompute

// Header cache: { 'SheetName:hrow': { headerName: [col1, col2, ...] } }
const _hdrCache = {}

// Resolve a column header spec to a 1-based column number.
// spec = exact header string, or 'Name~N' for the Nth occurrence.
// Returns null if not found.
async function getColByName(sheetName, hrow, spec) {
  const cacheKey = `${sheetName}:${hrow}`
  if(!_hdrCache[cacheKey]) {
    const r = await gGet(`/worksheets('${encodeURIComponent(sheetName)}')/range(address='${hrow}:${hrow}')`)
    const vals = (r&&r.values&&r.values[0]) || []
    // r may be null if token missing — getColByName returns null gracefully
    const map = {}
    vals.forEach((v, i) => {
      if(v !== null && v !== undefined && v !== '') {
        const name = String(v).trim()
        if(!map[name]) map[name] = []
        map[name].push(i + 1)
      }
    })
    _hdrCache[cacheKey] = map
  }
  const map = _hdrCache[cacheKey]
  const tildeIdx = spec.lastIndexOf('~')
  let name, occ
  if(tildeIdx > 0 && /^\d+$/.test(spec.slice(tildeIdx+1))) {
    name = spec.slice(0, tildeIdx)
    occ  = parseInt(spec.slice(tildeIdx+1), 10)
  } else {
    name = spec
    occ  = 1
  }
  const cols = map[name]
  if(!cols || cols.length < occ) { console.warn(`[col-name] "${name}"~${occ} not found in ${sheetName}`); return null }
  return cols[occ - 1]
}

async function initMsal(){
  if(_msal) return
  const { PublicClientApplication } = window.msal
  _msal = new PublicClientApplication({
    auth:  { clientId: CONFIG.clientId, authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`, redirectUri: 'https://mohit-sharma2614.github.io/Karnal-Dashboard/portal/index.html', navigateToLoginRequestUrl: false },
    cache: { cacheLocation:'localStorage' },
  })
  await _msal.initialize()
  const result = await _msal.handleRedirectPromise()
  if(result){
    if(!isAllowedAccount(result.account)){
      await _msal.logoutRedirect({ account:result.account })
      return
    }
    _token=result.accessToken
    _user=result.account?.name||result.account?.username
  }
  updateAuthUI()
}

function isAllowedAccount(account){
  if(!account) return false
  const email = (account.username||account.loginHint||'').toLowerCase()
  return CONFIG.allowedUsers.some(u=>u.toLowerCase()===email)
}

async function getToken(){
  const accounts = _msal.getAllAccounts()
  if(!accounts.length) return null
  const account = accounts[0]
  if(!isAllowedAccount(account)){
    await _msal.logoutRedirect({ account })
    return null
  }
  try{
    const r = await _msal.acquireTokenSilent({ scopes:CONFIG.scopes, account })
    _token=r.accessToken; _user=account.name||account.username
    return _token
  }catch{
    try{
      // Use popup so the page does not navigate away mid-upload
      const r2 = await _msal.acquireTokenPopup({ scopes:CONFIG.scopes, account })
      _token=r2.accessToken; _user=account.name||account.username
      return _token
    }catch{ return null }
  }
}

function updateAuthUI(){
  const accounts = _msal?.getAllAccounts()||[]
  const signedIn = accounts.length>0
  _user = accounts[0]?.name||accounts[0]?.username||_user
  window._user = _user
  document.getElementById('saveBtn').disabled = !signedIn
  document.getElementById('saveNote').textContent = signedIn ? `Signed in as ${_user}` : 'Sign in to enable saving'

}

function wbUrl(){ return `https://graph.microsoft.com/v1.0/drives/${CONFIG.driveId}/items/${CONFIG.fileId}/workbook` }

async function gGet(path, sessionId, _retry=0){
  const t=await getToken(); if(!t) return null
  const hdrs={Authorization:`Bearer ${t}`}
  if(sessionId) hdrs['workbook-session-id']=sessionId
  const r=await fetch(wbUrl()+path,{headers:hdrs})
  if((r.status===503||r.status===429)&&_retry<5){
    const wait=(_retry+1)*2000  // 2s, 4s, 6s, 8s, 10s
    await new Promise(res=>setTimeout(res,wait))
    return gGet(path,sessionId,_retry+1)
  }
  // After retries exhausted, throw so callers can show an error instead of silent "No data"
  if(!r.ok) throw new Error(`Graph ${r.status}: ${r.statusText||'Service Unavailable'}`)
  return r.json()
}
async function getReadSession(_retry=0){
  const t=await getToken(); if(!t) return null
  try{
    const r=await fetch(wbUrl()+'/createSession',{method:'POST',headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json'},body:JSON.stringify({persistChanges:false})})
    if((r.status===503||r.status===429)&&_retry<4){
      await new Promise(res=>setTimeout(res,(_retry+1)*2000))
      return getReadSession(_retry+1)
    }
    const d=await r.json()
    if(d.id){
      // Wait for workbook to fully load on Graph's server before making data requests
      await new Promise(res=>setTimeout(res,800))
      return d.id
    }
    return null
  }catch(e){
    if(_retry<2){ await new Promise(res=>setTimeout(res,2000)); return getReadSession(_retry+1) }
    return null
  }
}
async function gPatch(path,body,sessionId,_retry=0){
  const t=await getToken(); if(!t) throw new Error('Not signed in')
  const hdrs={Authorization:`Bearer ${t}`,'Content-Type':'application/json'}
  if(sessionId) hdrs['workbook-session-id']=sessionId
  const r=await fetch(wbUrl()+path,{method:'PATCH',headers:hdrs,body:JSON.stringify(body)})
  if((r.status===503||r.status===429)&&_retry<4){
    await new Promise(res=>setTimeout(res,(_retry+1)*2000))
    return gPatch(path,body,sessionId,_retry+1)
  }
  if(!r.ok) throw new Error(`Graph PATCH ${r.status}: ${r.statusText||'Error'}`)
  return r.json()
}
async function getSession(){
  const t=await getToken(); if(!t) return null
  const r=await fetch(wbUrl()+'/createSession',{method:'POST',headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json'},body:JSON.stringify({persistChanges:true})})
  const d=await r.json(); return d.id
}

async function fetchFBPrevBal(ds){
  const keys=['cd','pm','csl','gs','sg','ap']
  keys.forEach(k=>{ const el=document.getElementById('f_ob_'+k); if(el) el.value='Fetching…' })
  try{
    const serial=toExcelSerial(ds)
    const SN=encodeURIComponent('Feed_and_Balance')
    // Step 1: find the last row with a date <= today (opening balance = that day's closing balance)
    const dateData=await gGet(`/worksheets('${SN}')/range(address='A3:A500')`)
    const dateRows=(dateData&&dateData.values)||[]
    let lastRowNum=null
    for(let i=dateRows.length-1;i>=0;i--){
      const v=dateRows[i][0]; if(v===null||v===undefined) continue
      let s=null
      if(typeof v==='number') s=Math.round(v)
      else if(typeof v==='string'){
        const iso=v.match(/^(\d{4}-\d{2}-\d{2})/); if(iso) s=toExcelSerial(iso[1])
        const dmy=v.match(/^(\d{2})-(\d{2})-(\d{4})$/); if(dmy) s=toExcelSerial(`${dmy[3]}-${dmy[2]}-${dmy[1]}`)
      }
      if(s!==null && s<serial){ lastRowNum=3+i; break }
    }
    if(!lastRowNum){
      keys.forEach(k=>{ const el=document.getElementById('f_ob_'+k); if(el) el.value='0 (no prior data)' })
      return
    }
    // Step 2: resolve balance column positions using verified ~N counts
    const hrow = SHEET_META.FB.hrow
    const [cdCol,pmCol,cslCol,gsCol,sgCol,apCol] = await Promise.all([
      getColByName('Feed_and_Balance', hrow, 'Cow Dung~3'),
      getColByName('Feed_and_Balance', hrow, 'Pressmud~3'),
      getColByName('Feed_and_Balance', hrow, 'CSL Feed~2'),
      getColByName('Feed_and_Balance', hrow, 'Grain Syrup~5'),
      getColByName('Feed_and_Balance', hrow, 'Spent grain~3'),
      getColByName('Feed_and_Balance', hrow, 'Apple pomace~3'),
    ])
    const fetchCol = async (col) => {
      if(!col) return 0
      const r = await gGet(`/worksheets('${SN}')/range(address='${colLetter(col)}${lastRowNum}:${colLetter(col)}${lastRowNum}')`)
      return (r&&r.values&&r.values[0]&&r.values[0][0]) || 0
    }
    const [cdV,pmV,cslV,gsV,sgV,apV] = await Promise.all([
      fetchCol(cdCol),fetchCol(pmCol),fetchCol(cslCol),fetchCol(gsCol),fetchCol(sgCol),fetchCol(apCol)
    ])
    const balMap={cd:cdV,pm:pmV,csl:cslV,gs:gsV,sg:sgV,ap:apV}
    keys.forEach(k=>{
      const val=parseFloat(balMap[k])||0
      const el=document.getElementById('f_ob_'+k)
      if(el) el.value=val
    })
  } catch(e){
    console.error('fetchFBPrevBal',e)
    keys.forEach(k=>{ const el=document.getElementById('f_ob_'+k); if(el) el.value='Error' })
  }
}

async function fetchCalQty(sheetId){
  const cfg = CAL_QTY_COLS[sheetId]; if(!cfg) return
  const serial = toExcelSerial(today())
  const col = await getColByName('D1', 2, cfg.colName)
  if(!col) return
  const [rowD1, rowD2] = await Promise.all([
    findRow('D1', serial, 3),
    findRow('D2', serial, 3),
  ])
  let total = 0
  const reads = []
  if(rowD1) reads.push(gGet(`/worksheets('D1')/range(address='${colLetter(col)}${rowD1}')`))
  if(rowD2) reads.push(gGet(`/worksheets('D2')/range(address='${colLetter(col)}${rowD2}')`))
  const results = await Promise.all(reads)
  results.forEach(r=>{ if(r&&r.values&&r.values[0]&&r.values[0][0]) total+=parseFloat(r.values[0][0])||0 })
  if(total>0){
    inp.qty = Math.round(total*1000)/1000
    const el = document.getElementById('f_qty')
    if(el) el.value = inp.qty
    recompute()
  }
}

async function findRow(sheetName, serial, dataStart=3){
  const d=await gGet(`/worksheets('${encodeURIComponent(sheetName)}')/range(address='A${dataStart}:A400')`, window._wbReadSid||null)
  const rows=(d&&d.values)||[]
  for(let i=0;i<rows.length;i++){
    const v=rows[i][0]; if(v===null||v===undefined) continue
    // Match by serial number (our write format) or by parsed date
    if(typeof v==='number'&&v===serial) return dataStart+i
    if(typeof v==='string'){
      const iso=v.match(/^(\d{4}-\d{2}-\d{2})/); if(iso){ const s=toExcelSerial(iso[1]); if(s===serial) return dataStart+i }
      const dmy=v.match(/^(\d{2})-(\d{2})-(\d{4})$/); if(dmy){ const s=toExcelSerial(`${dmy[3]}-${dmy[2]}-${dmy[1]}`); if(s===serial) return dataStart+i }
    }
  }
  return null
}

    const dataStart = cur.dataStart || 3

    // Resolve column numbers by name using the master header row.
    // Falls back to empty map (nothing written) if sheet has no name map.
    const meta = SHEET_META[cur.id] || {}
    const masterSheet = meta.masterSheet || cur.sheet
    const hrow = meta.hrow || 2
    const nameMap = COLUMN_NAME_MAP[cur.id]
    const colMap = {}
    if(nameMap) {
      await Promise.all(Object.entries(nameMap).map(async ([fk, spec]) => {
        const col = await getColByName(masterSheet, hrow, spec)
        if(col) colMap[fk] = col
      }))
    }

    const rowData={}
    rowData[dateCol] = serial  // always an Excel serial integer — no locale ambiguity

    // Collect all fields with a resolved column number
    cur.sections.forEach(sec=>sec.f.forEach(f=>{
      const col = colMap[f.k]
      if(!col) return
      if(f.tp==='calc'){
        const el=document.getElementById('f_'+f.k)
        if(el&&el.value!=='') rowData[col]=parseFloat(el.value)
      } else {
        const v=inp[f.k]
        if(v!==null&&v!==undefined&&v!=='') rowData[col]=v
      }
    }))

    // MANURE: Month string auto-derived from date picker
    if(cur.id === 'MANURE') {
      const monthCol = await getColByName('Manure Sales', 2, 'Month')
      if(monthCol) {
        const [y,m] = ds.split('-')
        const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
        rowData[monthCol] = `${MON[parseInt(m,10)-1]}-${y}`
      }
    }

    // PSA: time-formatted cells must be converted to Excel time fractions
    // hrs fields: decimal hours ÷ 24; min fields: decimal minutes ÷ 60 ÷ 24; diff: minutes ÷ 60 ÷ 24
    if(cur.id === 'PSA') {
      const psaHrsCol  = colMap['psa_hrs']
      const compHrsCol = colMap['comp_hrs']
      const compMinCol = colMap['comp_min']
      const diffCol    = colMap['psa_comp_diff']
      if(psaHrsCol  && rowData[psaHrsCol])  rowData[psaHrsCol]  = rowData[psaHrsCol]  / 24
      if(compHrsCol && rowData[compHrsCol]) rowData[compHrsCol] = rowData[compHrsCol] / 24
      // psa_run_min stored as plain integer in master (upload doesn't convert it)
      // comp_min stored as time fraction (upload converts it ÷60÷24)
      if(compMinCol && rowData[compMinCol]) rowData[compMinCol] = rowData[compMinCol] / 60 / 24
      if(diffCol    && rowData[diffCol])    rowData[diffCol]    = rowData[diffCol]    / 60 / 24
    }

    const sn = masterSheet

    if(!sn){
      toast('This sheet has no direct save path — use the master workbook directly.',true)
      return
    }

    // ── Special: Monthly Fixed Costs (month-column structure) ────────────────
    if(cur.id==='FIXED'){
      const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December']
      const DAYS=[31,28,31,30,31,30,31,31,30,31,30,31]  // 2026 non-leap
      const CUM=[0,31,59,90,120,151,181,212,243,273,304,334]
      const mName=inp['month']; const mIdx=MONTHS.indexOf(mName)
      if(mIdx<0){ toast('Select a month first',true); return }
      const kvah=parseFloat(inp['elec_kvah'])||null
      const bill=parseFloat(inp['elec_bill'])||null
      if(!bill){ toast('Enter Electricity Bill (₹) at minimum',true); return }
      const monthCol=mIdx+4   // D=Jan=col4, E=Feb=col5 ... O=Dec=col15
      const colL=colLetter(monthCol)
      const sessionId=await getSession()
      const FC=encodeURIComponent('Monthly Fixed Costs')
      const RC=encodeURIComponent('Daily Revenue & Costs')
      const writes=[]
      if(kvah) writes.push(gPatch(`/worksheets('${FC}')/range(address='${colL}4')`,{values:[[kvah]]},sessionId))
      writes.push(gPatch(`/worksheets('${FC}')/range(address='${colL}5')`,{values:[[bill]]},sessionId))
      // Update Daily Revenue & Costs col H (electricity per day) for all days in month
      const days=DAYS[mIdx]
      const firstRow=4+CUM[mIdx]
      const daily=Math.round((bill/days)*100)/100
      const vals=Array.from({length:days},()=>[daily])
      writes.push(gPatch(`/worksheets('${RC}')/range(address='H${firstRow}:H${firstRow+days-1}')`,{values:vals},sessionId))
      const results=await Promise.all(writes)
      const err=results.find(r=>r&&r.error)
      if(err) toast(`Save failed: ${err.error.message}`,true)
      else {
        toast(`Saved electricity for ${mName}: ₹${bill.toLocaleString('en-IN')} → Monthly Fixed Costs + Daily Revenue & Costs updated`)
        const mSerial=toExcelSerial(`2026-${String(mIdx+1).padStart(2,'0')}-01`)
        appendSubmissionLog(mSerial, cur.label, sessionId).catch(()=>{})
      }
      return
    }
    // ── End special FIXED ────────────────────────────────────────────────────

    let rowNum

    if(isAppendSheet){
      // Append sheets: always add a new row — multiple entries per day are allowed.
      // Date is in col A (1) for all append sheets.
      const d=await gGet(`/worksheets('${encodeURIComponent(sn)}')/range(address='A${dataStart}:A500')`)
      const rows=(d&&d.values)||[]
      let last=dataStart-1
      for(let i=rows.length-1;i>=0;i--){ if(rows[i][0]!==null&&rows[i][0]!==''){ last=dataStart+i; break } }
      rowNum = last+1
    } else {
      rowNum = await findRow(sn, serial, dataStart)
      if(!rowNum){
        // New date — append after last filled row
        const d=await gGet(`/worksheets('${encodeURIComponent(sn)}')/range(address='A${dataStart}:A400')`)
        const rows=(d&&d.values)||[]
        let last=dataStart-1
        for(let i=rows.length-1;i>=0;i--){ if(rows[i][0]!==null&&rows[i][0]!==''){ last=dataStart+i; break } }
        rowNum=last+1
      }
    }

    const maxCol=Math.max(...Object.keys(rowData).map(Number),60)
    const values=Array(maxCol).fill(null)
    for(const[c,v]of Object.entries(rowData)) values[parseInt(c)-1]=v??null

    const sessionId=await getSession()
    const range=`A${rowNum}:${colLetter(maxCol)}${rowNum}`
    const res=await gPatch(`/worksheets('${encodeURIComponent(sn)}')/range(address='${range}')`,{values:[values]},sessionId)

    if(res&&res.error){ toast(`Save failed: ${res.error.message}`,true) }
    else {
      toast(`Saved to ${sn} row ${rowNum} (${fmtDisplay(ds)})`)
      appendSubmissionLog(serial, cur.label, sessionId).catch(()=>{})
    }
  }catch(e){ toast(`Error: ${e.message}`,true) }
  finally{
    document.getElementById('saveBtn').disabled=false
    document.getElementById('saveNote').textContent=`Signed in as ${_user}`
  }
}

async function appendSubmissionLog(dateSerial, sheetLabel, sessionId){
  const SL = encodeURIComponent('Submission Log')
  // Use usedRange to find last row — no hardcoded cap
  const used = await gGet(`/worksheets('${SL}')/usedRange(valuesOnly=true)`)
  const rowNum = used&&used.rowCount ? used.rowCount + 1 : 3
  const accounts = _msal?.getAllAccounts()||[]
  const email = accounts[0]?.username||''
  const name  = _user||email
  const now   = new Date()
  const ts    = `${now.getDate().toString().padStart(2,'0')}-${now.toLocaleString('en',{month:'short'})}-${now.getFullYear()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`
  await gPatch(`/worksheets('${SL}')/range(address='A${rowNum}:E${rowNum}')`,
    {values:[[dateSerial, sheetLabel, name, email, ts]]}, sessionId)
  // Refresh in-memory _subLog so sidebar stays accurate after save
  loadSubLog().catch(()=>{})
}

function colLetter(n){ let s=''; while(n>0){n--;s=String.fromCharCode(65+(n%26))+s;n=Math.floor(n/26)} return s }

document.getElementById('saveBtn').onclick=window.handleSave

function today(){
  // Use local date components — toISOString() returns UTC which can be 1 day behind in IST at midnight
  const d = new Date()
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
}

function onDateChange(){
  const el = document.getElementById('dp')
  const ds = el?.value
  const errEl = document.getElementById('dp-err')
  const dispEl = document.getElementById('dp-display')
  if(!isValidDate(ds)){
    if(errEl){ errEl.textContent='Invalid date'; errEl.style.display='inline' }
    if(dispEl) dispEl.textContent=''
    return
  }
  // Past dates allowed — will load existing data if available
  if(errEl) errEl.style.display='none'
  const serial = toExcelSerial(ds)
  const roundtrip = fromExcelSerial(serial)
  // Round-trip check: serial → date must equal original to catch any conversion error
  if(roundtrip !== ds){
    if(errEl){ errEl.textContent=`Date conversion error (${roundtrip})`; errEl.style.display='inline' }
    return
  }
  if(dispEl) dispEl.textContent=`${fmtDisplay(ds)}  ·  serial ${serial}`
  recompute()
  if(cur&&cur.id==='FB') fetchFBPrevBal(ds)
  // Load existing row data for date-row sheets (not append sheets)
  const _appendIds=['PMCAL','GSCAL','CSLCAL','CDCAL','SGCAL','APPCAL','MANURE','MAINT']
  if(cur&&cur.hasDate&&!_appendIds.includes(cur.id)) fetchExistingRow(cur.id,ds)
}
window.onDateChange=onDateChange

// ── Load existing row data into form when date is selected ───────────────────
async function fetchExistingRow(sheetId, dateStr){
  if(!dateStr||!isValidDate(dateStr)) return
  if(!COLUMN_NAME_MAP[sheetId]) return
  const meta=SHEET_META[sheetId]||{}
  const masterSheet=meta.masterSheet||(SHEETS.find(s=>s.id===sheetId)||{}).sheet||sheetId
  const hrow=meta.hrow||2
  const dataStart=(SHEETS.find(s=>s.id===sheetId)||{}).dataStart||3
  try{
    const t=await getToken().catch(()=>null); if(!t) return
    const serial=toExcelSerial(dateStr)
    const rowNum=await findRow(masterSheet,serial,dataStart)
    if(!rowNum) return  // no existing data for this date — keep fields at 0
    // Ensure header cache is populated
    const cacheKey=`${masterSheet}:${hrow}`
    if(!_hdrCache[cacheKey]){
      const r=await gGet(`/worksheets('${encodeURIComponent(masterSheet)}')/range(address='${hrow}:${hrow}')`)
      const vals=(r&&r.values&&r.values[0])||[]
      const map={}
      vals.forEach((v,i)=>{
        if(v!==null&&v!==undefined&&v!==''){
          const name=String(v).trim()
          if(!map[name]) map[name]=[]
          map[name].push(i+1)
        }
      })
      _hdrCache[cacheKey]=map
    }
    const hmap=_hdrCache[cacheKey]
    // Resolve all field column numbers
    const nameMap=COLUMN_NAME_MAP[sheetId]
    const colNums={}
    let maxCol=1
    for(const [fk,spec] of Object.entries(nameMap)){
      const tildeIdx=spec.lastIndexOf('~')
      let name,occ
      if(tildeIdx>0&&/^\d+$/.test(spec.slice(tildeIdx+1))){ name=spec.slice(0,tildeIdx); occ=parseInt(spec.slice(tildeIdx+1),10) }
      else { name=spec; occ=1 }
      const cols=hmap[name]
      if(cols&&cols.length>=occ){ colNums[fk]=cols[occ-1]; if(cols[occ-1]>maxCol) maxCol=cols[occ-1] }
    }
    // Read entire row up to maxCol
    const enc=encodeURIComponent(masterSheet)
    const rowData=await gGet(`/worksheets('${enc}')/range(address='A${rowNum}:${colLetter(maxCol)}${rowNum}')`)
    if(!rowData||!rowData.values||!rowData.values[0]) return
    const rowVals=rowData.values[0]
    // Populate form fields
    let loaded=0
    for(const [fk,colNum] of Object.entries(colNums)){
      const el=document.getElementById('f_'+fk)
      if(!el||el.readOnly) continue
      const v=rowVals[colNum-1]
      if(v===null||v===undefined||v==='') continue
      // PSA time fields: psa_hrs/comp_hrs stored as hours÷24; comp_min stored as mins÷60÷24; psa_run_min plain integer
      let displayVal=v
      if(sheetId==='PSA'&&typeof v==='number'){
        if(fk==='psa_hrs'||fk==='comp_hrs') displayVal=Math.round(v*24*1000)/1000
        else if(fk==='comp_min') displayVal=Math.round(v*24*60*10)/10
      }
      el.value=displayVal
      inp[fk]=typeof displayVal==='number'?displayVal:parseFloat(displayVal)||displayVal
      loaded++
    }
    if(loaded>0){ recompute(); toast(`Loaded ${dateStr} — ${loaded} field${loaded===1?'':'s'} populated`) }
  }catch(e){ console.error('[fetchExistingRow]',e) }
}
window.fetchExistingRow=fetchExistingRow
function toast(msg,err=false){
  const t=document.getElementById('toast')
  t.textContent=msg; t.className=err?'err':''; t.style.display='block'
  setTimeout(()=>t.style.display='none',3200)
}

      <div class="fg"><label>Typical supply (${_fsWizData.unit||'MT'}/day)</label><input type="number" id="fs_supply" step="any" placeholder="0" value="${_fsWizData.supply||''}" oninput="_fsWizData.supply=parseFloat(this.value)||0"/></div>

      <div class="fg"><label>BPP Rate (m³ gas per ${_fsWizData.unit||'MT'})</label><input type="number" id="fs_bpp" step="any" placeholder="e.g. 130" value="${_fsWizData.bpp||''}" oninput="_fsWizData.bpp=parseFloat(this.value)||0"/></div>

function validateFsStep(){
  if(_fsWizStep===1){
    if(!_fsWizData.name||!_fsWizData.name.trim()){ toast('Feedstock name is required',true); return false }
    if(!_fsWizData.id||!/^[A-Za-z0-9]{2,6}$/.test(_fsWizData.id)){ toast('Short ID must be 2–6 alphanumeric characters',true); return false }
    if(!_fsWizData.unit){ toast('Unit is required',true); return false }
  }
  if(_fsWizStep===2){
    if(!_fsWizData.cost||isNaN(_fsWizData.cost)||Number(_fsWizData.cost)<=0){ toast('Enter a valid cost per MT',true); return false }
  }
  if(_fsWizStep===3){
    if(!_fsWizData.bpp||isNaN(_fsWizData.bpp)||Number(_fsWizData.bpp)<=0){ toast('Enter a valid BPP rate',true); return false }
  }
  return true
}

async function registerFeedstock(data){
  if(!data.name||!data.id){ toast('Name and ID are required',true); return }
  const btn=document.querySelector('#main button[onclick^="registerFeedstock"]')
  if(btn){ btn.disabled=true; btn.textContent='Registering…' }

  // 3-lock: read existing headers, append new columns, read back to verify
  try{
    await initMsal(); const t=await getToken()
    if(!t){ toast('Sign in to register feedstock',true); if(btn){ btn.disabled=false; btn.textContent='Register Feedstock ✓' } return }
    const sid=await getSession()

    // Lock 1: read current used range to find last column
    const d1=await gGet(`/worksheets('D1')/usedRange`)
    if(!d1||d1.error) throw new Error('Could not read D1 used range')
    const lastCol=d1.columnCount||60
    const newColIdx=lastCol+1

    // Lock 2: write 3 header cells
    const hdrRow=2
    const cols=[newColIdx,newColIdx+1,newColIdx+2]
    const hdrs=[`${data.id}_exp`,`${data.id}_act`,`${data.id}_bpp`]
    for(let i=0;i<3;i++){
      const addr=`${colLetter(cols[i])}${hdrRow}`
      await gPatch(`/worksheets('D1')/range(address='${addr}')`,{values:[[hdrs[i]]]},sid)
      await gPatch(`/worksheets('D2')/range(address='${addr}')`,{values:[[hdrs[i]]]},sid)
    }

    // Lock 3: read back to verify
    const verify=await gGet(`/worksheets('D1')/range(address='${colLetter(cols[0])}${hdrRow}:${colLetter(cols[2])}${hdrRow}')`)
    if(!verify||!verify.values) throw new Error('Verification read failed')
    const written=verify.values[0]||[]
    for(let i=0;i<3;i++){
      if(String(written[i]).toLowerCase()!==hdrs[i].toLowerCase()) throw new Error(`Header mismatch: expected ${hdrs[i]}, got ${written[i]}`)
    }

    // Persist to registry — colOffset relative to first data column (col 2 = date, col 3 = first data)
    const colOffset=newColIdx-lastCol
    const reg=JSON.parse(localStorage.getItem('FEEDSTOCK_REGISTRY')||'[]')
    reg.push({...data,colIdx:newColIdx,colOffset,registeredAt:new Date().toISOString()})
    localStorage.setItem('FEEDSTOCK_REGISTRY',JSON.stringify(reg))

    // Register header names in COLUMN_NAME_MAP so getColByName and buildCmFromHeaders can resolve them
    COLUMN_NAME_MAP['D1'][`${data.id}_exp`]=`${data.id}_exp`; COLUMN_NAME_MAP['D1'][`${data.id}_act`]=`${data.id}_act`; COLUMN_NAME_MAP['D1'][`${data.id}_bpp`]=`${data.id}_bpp`
    COLUMN_NAME_MAP['D2'][`${data.id}_exp`]=`${data.id}_exp`; COLUMN_NAME_MAP['D2'][`${data.id}_act`]=`${data.id}_act`; COLUMN_NAME_MAP['D2'][`${data.id}_bpp`]=`${data.id}_bpp`

    toast(`${data.name} registered — columns added at ${colLetter(cols[0])}–${colLetter(cols[2])}`)
    renderHome()
  } catch(e){
    toast(`Registration failed: ${e.message}`,true)
    if(btn){ btn.disabled=false; btn.textContent='Register Feedstock ✓' }
  }
}

async function loadSubLog(){
  try{
