<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBG Karnal — Data Entry Portal</title>
  <style>
    :root {
      --bg:#f0f2f8; --surface:#fff; --border:#dde1ec; --text:#1a1d2e;

      --calc:#92400e; --calc-bg:#fffbeb;
      --success:#16a34a; --danger:#dc2626;
      --warn-bg:#fef3c7; --warn-text:#92400e;
      --radius:8px; --header-h:54px;
    }
    @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
      --bg:#0f1117;--surface:#1a1d2e;--border:#2d3148;--text:#e8eaf6;
      --muted:#8892b0;--accent:#3b82f6;--calc:#fbbf24;--calc-bg:#1c1400;
      --warn-bg:#1c1400;--warn-text:#fbbf24;
    }}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

    header{
      height:var(--header-h);background:var(--accent);color:#fff;
      display:flex;align-items:center;padding:0 18px;gap:10px;
      position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3);
    }
    .logo{width:30px;height:30px;background:rgba(255,255,255,.2);border-radius:6px;
      display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;flex-shrink:0;}
    header h1{font-size:.92rem;font-weight:600;flex:1;}
    .hbtn{padding:5px 13px;border-radius:6px;border:1.5px solid rgba(255,255,255,.6);
      background:transparent;color:#fff;cursor:pointer;font-size:.8rem;font-weight:500;}
    .hbtn.solid{background:#fff;color:var(--accent);border-color:#fff;font-weight:700;}

    #banner{background:var(--warn-bg);color:var(--warn-text);text-align:center;
      padding:7px;font-size:.8rem;font-weight:500;border-bottom:1px solid rgba(0,0,0,.07);}

    .layout{display:flex;height:calc(100vh - var(--header-h) - 35px);}

    nav{width:205px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;}
    .ng{padding:10px 13px 3px;font-size:.67rem;font-weight:700;letter-spacing:.09em;
      text-transform:uppercase;color:var(--muted);}
    nav button{display:block;width:100%;text-align:left;padding:7px 13px;border:none;
      background:none;color:var(--text);cursor:pointer;font-size:.83rem;
      border-left:3px solid transparent;transition:background .1s;}
    nav button:hover{background:var(--bg);}
    nav button.active{border-left-color:var(--accent);color:var(--accent);font-weight:600;background:var(--bg);}

    .content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    main{flex:1;overflow-y:auto;padding:18px 22px;}

    .sh{margin-bottom:14px;}
    .sh h2{font-size:1rem;font-weight:700;}
    .sh .sub{font-size:.78rem;color:var(--muted);margin-top:2px;}

    .date-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;
      padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
    .date-row label{font-size:.8rem;font-weight:600;}
    .date-row input[type="date"]{padding:5px 9px;border:1px solid var(--border);border-radius:6px;
      background:var(--bg);color:var(--text);font-size:.86rem;}

    .sec{margin-bottom:22px;}
    .sec-title{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
      color:var(--muted);padding-bottom:7px;border-bottom:1px solid var(--border);margin-bottom:12px;}
    .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:12px;}
    .fg{display:flex;flex-direction:column;gap:3px;}
    .fg label{font-size:.72rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:4px;}
    .atag{font-size:.63rem;color:var(--calc);font-weight:700;letter-spacing:.04em;
      text-transform:uppercase;background:var(--calc-bg);padding:1px 4px;border-radius:3px;}
    .fg input,.fg select,.fg textarea{
      padding:6px 9px;border:1px solid var(--border);border-radius:6px;
      background:var(--surface);color:var(--text);font-size:.88rem;
      font-variant-numeric:tabular-nums;transition:border-color .15s;width:100%;}
    .fg input:focus,.fg select:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
    .fg input.cf{background:var(--calc-bg);color:var(--calc);font-weight:600;border-color:transparent;cursor:default;}
    .fg textarea{resize:vertical;min-height:60px;}

    .save-bar{padding:10px 22px;background:var(--surface);border-top:1px solid var(--border);
      display:flex;align-items:center;gap:12px;}
    #saveBtn{padding:7px 22px;border:none;border-radius:6px;background:var(--accent);
      color:#fff;cursor:pointer;font-size:.88rem;font-weight:600;}
    #saveBtn:disabled{opacity:.4;cursor:not-allowed;}
    #saveNote{font-size:.78rem;color:var(--muted);}

    #toast{position:fixed;bottom:22px;right:22px;padding:11px 18px;border-radius:var(--radius);
      background:var(--success);color:#fff;font-size:.86rem;font-weight:500;
      box-shadow:0 4px 16px rgba(0,0,0,.2);display:none;z-index:999;}
    #toast.err{background:var(--danger);}
  </style>
</head>

  <div class="logo">CBG</div>

// ════════════════════════════════════════════════════════════════
// FORMULA ENGINE
// ════════════════════════════════════════════════════════════════
function getMonth(dateStr){ return dateStr ? new Date(dateStr).getMonth()+1 : new Date().getMonth()+1 }

const FN = {
  bpp_cd:  (v,m) => (v.cd_act||0)*R.CD.bpp,
  bpp_pm:  (v,m) => (v.pm_act||0)*(R.PM.bpp[m]||95),
  bpp_gs:  (v,m) => (v.gs_act||0)*R.GS.bpp,
  bpp_csl: (v,m) => (v.csl_act||0)*R.CSL.bpp,
  wv:      (v,m) => {
    const h = (v.sl_ht && v.sl_ht>0) ? v.sl_ht : ([1,2,3].includes(m)?R.DIGESTER.hWinter:R.DIGESTER.hOther)
    return Math.PI*Math.pow(R.DIGESTER.radius,2)*h
  },
  olr:     (v,m,lk) => lk.wv>0 ? 0 : null, // placeholder until VS kg wired
  psa_eff: (v,m,lk) => (lk.psa_hrs||0)>0 ? ((v.cbg_prod||0)/((lk.psa_hrs)*R.PSA.basis))*100 : null,
}

function runCalcs(sheet, inputs, dateStr){
  const m = getMonth(dateStr)
  const wv = FN.wv(inputs,m)
  const lk = {wv, psa_hrs: inputs.psa_hrs||0}
  const out = {}
  for(const sec of sheet.sections){
    for(const f of sec.fields){
      if(f.t!=='calc') continue
      const fn = FN[f.fn]
      if(!fn) continue
      const v = fn(inputs,m,lk)
      out[f.k] = v!==null&&v!==undefined ? Math.round(v*100)/100 : null
    }
  }
  return out
}

// ════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════
let cur = null
let inputs = {}

// ════════════════════════════════════════════════════════════════
// BUILD NAV
// ════════════════════════════════════════════════════════════════
function buildNav(){
  const nav = document.getElementById('nav')
  const groups = {}
  SHEETS.forEach(s=>{ if(!groups[s.group]) groups[s.group]=[]; groups[s.group].push(s) })
  let html = ''
  for(const [grp,items] of Object.entries(groups)){
    html += `<div class="ng">${grp}</div>`
    items.forEach(s=>{
      html += `<button data-id="${s.id}" onclick="loadSheet('${s.id}')">${s.label}</button>`
    })
  }
  nav.innerHTML = html
}

// ════════════════════════════════════════════════════════════════
// LOAD SHEET
// ════════════════════════════════════════════════════════════════
function loadSheet(id){
  cur = SHEETS.find(s=>s.id===id)
  inputs = {}
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id))

  const main = document.getElementById('main')
  const needsDate = !['PMCAL','CDCAL','GSCAL','CSLCAL','FIXED','EMI'].includes(id)

  let html = `
    <div class="sh">
      <h2>${cur.label}</h2>
      <div class="sub">Sheet: <b>${cur.sheet}</b></div>
    </div>`

  if(needsDate){
    html += `
    <div class="date-row">
      <label>Date</label>
      <input type="date" id="dp" value="${today()}" oninput="recompute()" />
      <span style="font-size:.78rem;color:var(--muted);">Enter date then fill fields below</span>
    </div>`
  }

  cur.sections.forEach(sec=>{
    html += `<div class="sec"><div class="sec-title">${sec.title}</div><div class="fgrid">`
    sec.fields.forEach(f=>{
      if(f.t==='info'){
        html += `<div class="fg" style="grid-column:1/-1;color:var(--muted);font-size:.8rem;font-style:italic;padding:4px 0;">${f.l}</div>`
        return
      }
      html += `<div class="fg"><label>${f.l}${f.t==='calc'?'<span class="atag">auto</span>':''}</label>`
      if(f.t==='calc'){
        html += `<input type="text" id="f_${f.k}" class="cf" readonly placeholder="—" tabindex="-1" />`
      } else if(f.t==='sel'){
        html += `<select id="f_${f.k}" onchange="onInp('${f.k}',this.value)"><option value="">— select —</option>`
        f.opts.forEach(o=> html+=`<option>${o}</option>`)
        html += `</select>`
      } else if(f.t==='txt'){
        html += `<input type="text" id="f_${f.k}" placeholder="" oninput="onInp('${f.k}',this.value)" />`
      } else {
        html += `<input type="number" id="f_${f.k}" step="any" placeholder="0" oninput="onInp('${f.k}',this.value)" />`
      }
      html += `</div>`
    })
    html += `</div></div>`
  })

  main.innerHTML = html
  recompute()
}

// ════════════════════════════════════════════════════════════════
// INPUT + CALC
// ════════════════════════════════════════════════════════════════
function onInp(k,v){ inputs[k]=v===''?null:(isNaN(v)?v:parseFloat(v)); recompute() }
window.onInp = onInp

function recompute(){
  if(!cur) return
  const dateStr = document.getElementById('dp')?.value
  const calcs = runCalcs(cur, inputs, dateStr)
  for(const [k,v] of Object.entries(calcs)){
    const el = document.getElementById('f_'+k)
    if(el) el.value = v!==null?v:''
  }
}
window.recompute = recompute

// ════════════════════════════════════════════════════════════════
// SAVE / AUTH
// ════════════════════════════════════════════════════════════════
window.handleSave = function(){ toast('Sign in first to save data to SharePoint',true) }
window.handleSignIn = function(){ toast('Azure AD configuration coming soon',true) }
document.getElementById('saveBtn').onclick = window.handleSave

function today(){ return new Date().toISOString().slice(0,10) }

function toast(msg,err=false){
  const t=document.getElementById('toast')
  t.textContent=msg; t.className=err?'err':''
  t.style.display='block'
  setTimeout(()=>t.style.display='none',3000)
}

// BOOT
// ════════════════════════════════════════════════════════════════
buildNav()
loadSheet('D1')
</script>
