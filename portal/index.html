<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>CBG Karnal — Data Entry Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{
      --bg:#f0f2f8;--surface:#fff;--border:#dde1ec;--text:#1a1d2e;
      --muted:#6b7280;--accent:#1c52a3;--accent2:#2563eb;
      --calc:#92400e;--calc-bg:#fffbeb;
      --success:#16a34a;--danger:#dc2626;
      --warn-bg:#fef3c7;--warn-text:#92400e;
      --radius:8px;--hh:54px;
    }
    @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
      --bg:#0f1117;--surface:#1a1d2e;--border:#2d3148;--text:#e8eaf6;
      --muted:#8892b0;--accent:#3b82f6;--calc:#fbbf24;--calc-bg:#1c1400;
      --warn-bg:#1c1400;--warn-text:#fbbf24;
    }}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    header{height:var(--hh);background:var(--accent);color:#fff;display:flex;align-items:center;
      padding:0 18px;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3);}
    .logo{width:30px;height:30px;background:rgba(255,255,255,.2);border-radius:6px;
      display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;flex-shrink:0;}
    header h1{font-size:.9rem;font-weight:600;flex:1;}
    .hbtn{padding:5px 13px;border-radius:6px;border:1.5px solid rgba(255,255,255,.6);
      background:transparent;color:#fff;cursor:pointer;font-size:.8rem;font-weight:500;}
    #banner{background:var(--warn-bg);color:var(--warn-text);text-align:center;
      padding:7px;font-size:.79rem;font-weight:500;border-bottom:1px solid rgba(0,0,0,.07);}
    .layout{display:flex;height:calc(100vh - var(--hh) - 33px);}
    nav{width:210px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;}
    .ng{padding:10px 13px 3px;font-size:.66rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
    nav button{display:block;width:100%;text-align:left;padding:7px 13px;border:none;background:none;
      color:var(--text);cursor:pointer;font-size:.82rem;border-left:3px solid transparent;transition:background .1s;}
    nav button:hover{background:var(--bg);}
    nav button.active{border-left-color:var(--accent);color:var(--accent);font-weight:600;background:var(--bg);}
    .content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    main{flex:1;overflow-y:auto;padding:16px 20px;}
    .sh{margin-bottom:12px;}
    .sh h2{font-size:.98rem;font-weight:700;}
    .sh .sub{font-size:.77rem;color:var(--muted);margin-top:2px;}
    .date-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;
      padding:9px 13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
    .date-row label{font-size:.79rem;font-weight:600;}
    .date-row input[type="date"]{padding:5px 8px;border:1px solid var(--border);border-radius:6px;
      background:var(--bg);color:var(--text);font-size:.85rem;}
    .sec{margin-bottom:20px;}
    .sec-title-row{display:flex;align-items:center;justify-content:space-between;padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:11px;}
    .sec-title{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
    .clear-btn{font-size:.65rem;font-weight:600;color:var(--danger);background:none;border:1px solid var(--danger);
      border-radius:4px;padding:2px 8px;cursor:pointer;opacity:.7;transition:opacity .15s;}
    .clear-btn:hover{opacity:1;}
    .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px;}
    .fg{display:flex;flex-direction:column;gap:3px;}
    .fg label{font-size:.71rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:4px;}
    .atag{font-size:.62rem;color:var(--calc);font-weight:700;letter-spacing:.04em;
      text-transform:uppercase;background:var(--calc-bg);padding:1px 4px;border-radius:3px;}
    .fg input,.fg select,.fg textarea{padding:6px 8px;border:1px solid var(--border);border-radius:6px;
      background:var(--surface);color:var(--text);font-size:.87rem;
      font-variant-numeric:tabular-nums;transition:border-color .15s;width:100%;}
    .fg input:focus,.fg select:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
    .fg input.cf{background:var(--calc-bg);color:var(--calc);font-weight:600;border-color:transparent;cursor:default;}
    .fg textarea{resize:vertical;min-height:56px;}
    .info-row{grid-column:1/-1;color:var(--muted);font-size:.78rem;font-style:italic;padding:3px 0;}
    .save-bar{padding:9px 20px;background:var(--surface);border-top:1px solid var(--border);
      display:flex;align-items:center;gap:12px;}
    #saveBtn{padding:7px 22px;border:none;border-radius:6px;background:var(--accent);
      color:#fff;cursor:pointer;font-size:.87rem;font-weight:600;}
    #saveBtn:disabled{opacity:.4;cursor:not-allowed;}
    #saveNote{font-size:.77rem;color:var(--muted);}
    #toast{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:var(--radius);
      background:var(--success);color:#fff;font-size:.85rem;font-weight:500;
      box-shadow:0 4px 14px rgba(0,0,0,.2);display:none;z-index:999;}
    #toast.err{background:var(--danger);}
    /* ── Upload Feature ─────────────────────────────────── */
    .upl-nav-btn{
      display:flex;align-items:center;gap:7px;
      width:100%;text-align:left;padding:9px 13px 9px 10px;
      border:none;border-left:3px solid transparent;
      border-top:1px solid var(--border);
      background:none;color:var(--accent);
      cursor:pointer;font-size:.82rem;font-weight:600;
      transition:background .1s;letter-spacing:.01em;
    }
    .upl-nav-btn:hover{background:var(--bg);}
    .upl-nav-btn.active{border-left-color:var(--accent);background:var(--bg);}
    .upl-file-panel{
      background:var(--surface);border:1px solid var(--border);
      border-radius:var(--radius);padding:18px 20px;
      display:flex;align-items:center;gap:16px;margin-bottom:20px;
      transition:border-color .15s;
    }
    .upl-file-panel:hover{border-color:var(--accent2);}
    .upl-file-icon{flex-shrink:0;color:var(--accent);opacity:.7;}
    .upl-file-meta{flex:1;min-width:0;}
    .upl-file-label{font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
    .upl-file-name{font-size:.87rem;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .upl-file-name.empty{color:var(--muted);font-style:italic;}
    .upl-browse-btn{flex-shrink:0;padding:6px 14px;border:1px solid var(--accent);border-radius:6px;
      background:none;color:var(--accent);font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;
      transition:background .12s,color .12s;}
    .upl-browse-btn:hover{background:var(--accent);color:#fff;}
    .upl-wb-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
    .upl-wb-chip{font-size:.74rem;font-weight:500;color:var(--muted);
      border:1px solid var(--border);border-radius:20px;padding:3px 10px;
      background:var(--surface);}
    .upl-loading{font-size:.85rem;color:var(--muted);padding:4px 0;}
    .upl-sheet-grid{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
    .upl-sheet-card{background:var(--bg);border:1px solid var(--border);border-radius:6px;
      padding:9px 12px;min-width:145px;flex:1;}
    .upl-sc-name{font-weight:700;font-size:.82rem;color:var(--text);}
    .upl-sc-rows{font-size:.77rem;color:var(--accent);margin-top:3px;}
    .upl-sc-dates{font-size:.74rem;color:var(--muted);margin-top:1px;}
    .upl-sc-mode{font-size:.7rem;color:var(--muted);margin-top:1px;}
    .upl-tbl{width:100%;border-collapse:collapse;font-size:.8rem;}
    .upl-tbl th{background:var(--bg);padding:5px 8px;text-align:left;font-weight:600;
      border-bottom:1px solid var(--border);white-space:nowrap;color:var(--muted);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;}
    .upl-tbl td{padding:5px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
    .upl-tbl tr:last-child td{border-bottom:none;}
    #uplProgress{max-height:200px;overflow-y:auto;background:var(--bg);
      border:1px solid var(--border);border-radius:var(--radius);
      padding:10px 12px;font-size:.79rem;font-family:'Cascadia Code','Consolas',monospace;line-height:1.7;margin-top:14px;}
    .upl-log-ok{color:var(--text);}
    .upl-log-err{color:var(--danger);font-weight:600;}
  </style>
</head>
<body>
<header>

<div id="toast"></div>

// Always append T00:00:00 — prevents UTC midnight from shifting to previous day in IST
function getMonth(ds){ return ds ? new Date(ds + 'T00:00:00').getMonth()+1 : new Date().getMonth()+1 }

// Returns true only for real calendar dates (blocks Feb 30, Apr 31, etc.)
function isValidDate(ds){
  if(!ds) return false
  const d = new Date(ds + 'T00:00:00')
  if(isNaN(d)) return false
  const [y,m,day] = ds.split('-').map(Number)
  return d.getFullYear()===y && d.getMonth()+1===m && d.getDate()===day
}

// Format YYYY-MM-DD → DD-MM-YYYY for display
function fmtDisplay(ds){ if(!ds) return ''; const [y,m,d]=ds.split('-'); return `${d}-${m}-${y}` }

// Convert YYYY-MM-DD → Excel serial number (locale-proof integer for writing to Excel)
// Excel epoch = Dec 30 1899 (Lotus leap-year bug offset)
// Example: 2026-09-14 → 46088
// Always use this when building the rowData date column — never send a date string.
function toExcelSerial(ds){
  const d     = new Date(ds + 'T00:00:00')
  const epoch = new Date('1899-12-30T00:00:00')
  return Math.round((d - epoch) / 86400000)
}

// Sanity-check: convert Excel serial back to YYYY-MM-DD (used in save verification)
function fromExcelSerial(n){
  const d = new Date(new Date('1899-12-30T00:00:00').getTime() + n * 86400000)
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
}
function n(v){ return parseFloat(v)||0 }

const FN = {
  // BPP
  bpp_cd:    (v,m) => n(v.cd_act)*45,
  bpp_pm:    (v,m) => n(v.pm_act)*(PM_BPP[m]||95),
  bpp_gs:    (v,m) => n(v.gs_act)*220,
  bpp_csl:   (v,m) => n(v.csl_act)*270,
  bpp_sg:    (v,m) => n(v.sg_act)*130,
  bpp_ap:    (v,m) => n(v.ap_act)*100,
  tot_bpp:   (v,m) => n(v.cd_act)*45 + n(v.pm_act)*(PM_BPP[m]||95) + n(v.gs_act)*220 + n(v.csl_act)*270 + n(v.sg_act)*130 + n(v.ap_act)*100,

  // TS tonnes
  cd_ts_t:   (v) => n(v.cd_act)  * (n(v.cd_ts)/100),
  pm_ts_t:   (v) => n(v.pm_act)  * (n(v.pm_ts)/100),
  gs_ts_t:   (v) => n(v.gs_act)  * DENSITY.GS  * (n(v.gs_ts)/100),
  csl_ts_t:  (v) => n(v.csl_act) * DENSITY.CSL * (n(v.csl_ts)/100),

  // VS tonnes
  cd_vs_t:   (v) => n(v.cd_act)  * (n(v.cd_ts)/100) * (n(v.cd_vs)/100),
  pm_vs_t:   (v) => n(v.pm_act)  * (n(v.pm_ts)/100) * (n(v.pm_vs)/100),
  gs_vs_t:   (v) => n(v.gs_act)  * DENSITY.GS  * (n(v.gs_ts)/100) * (n(v.gs_vs)/100),
  csl_vs_t:  (v) => n(v.csl_act) * DENSITY.CSL * (n(v.csl_ts)/100) * (n(v.csl_vs)/100),

  // Total VS kg
  tot_vs_kg: (v) => {
    const cd  = n(v.cd_act)  * (n(v.cd_ts)/100)  * (n(v.cd_vs)/100)
    const pm  = n(v.pm_act)  * (n(v.pm_ts)/100)  * (n(v.pm_vs)/100)
    const gs  = n(v.gs_act)  * DENSITY.GS  * (n(v.gs_ts)/100) * (n(v.gs_vs)/100)
    const csl = n(v.csl_act) * DENSITY.CSL * (n(v.csl_ts)/100)* (n(v.csl_vs)/100)
    return (cd+pm+gs+csl)*1000
  },

  // Digester performance
  wv: (v,m) => {
    const h = n(v.sl_ht)>0 ? n(v.sl_ht) : ([1,2,3].includes(m)?H.winter:H.other)
    return Math.PI*RADIUS*RADIUS*h
  },
  olr: (v,m) => {
    const wv = Math.PI*RADIUS*RADIUS*(n(v.sl_ht)>0?n(v.sl_ht):([1,2,3].includes(m)?H.winter:H.other))
    const cd  = n(v.cd_act)  * (n(v.cd_ts)/100)  * (n(v.cd_vs)/100)
    const pm  = n(v.pm_act)  * (n(v.pm_ts)/100)  * (n(v.pm_vs)/100)
    const gs  = n(v.gs_act)  * DENSITY.GS  * (n(v.gs_ts)/100) * (n(v.gs_vs)/100)
    const csl = n(v.csl_act) * DENSITY.CSL * (n(v.csl_ts)/100)* (n(v.csl_vs)/100)
    const vs_kg = (cd+pm+gs+csl)*1000
    return wv>0 ? vs_kg/wv : null
  },
  psa_eff:   (v) => n(v.psa_hrs)>0 ? (n(v.cbg_prod)/(n(v.psa_hrs)*PSA_BASIS))*100 : null,
  dig_eff:   (v,m) => {
    const bpp = n(v.cd_act)*45 + n(v.pm_act)*(PM_BPP[m]||95) + n(v.gs_act)*220 + n(v.csl_act)*270
    return (bpp>0 && n(v.rbg_psa)>0) ? (n(v.rbg_psa)/bpp)*100 : null
  },

  // BPP day-wise (30/40/30 for CD & PM; 100% for GS & CSL)
  bpp_d0: (v,m) => (n(v.cd_act)*45*0.3) + (n(v.pm_act)*(PM_BPP[m]||95)*0.3) + n(v.gs_act)*220 + n(v.csl_act)*270,
  bpp_d1: (v,m) => (n(v.cd_act)*45*0.4) + (n(v.pm_act)*(PM_BPP[m]||95)*0.4),
  bpp_d2: (v,m) => (n(v.cd_act)*45*0.3) + (n(v.pm_act)*(PM_BPP[m]||95)*0.3),

  // PSA
  // Cal sheets: TS Tonnes = Qty Fed × (TS%/100); VS Tonnes = TS Tonnes × VS_factor
  // VS% stored as fraction (<2) for PMCAL, as percentage for CDCAL/GSCAL/CSLCAL
  cal_ts_t: (v) => n(v.qty)>0 && n(v.ts_pct)>0 ? Math.round(n(v.qty)*(n(v.ts_pct)/100)*10000)/10000 : null,
  cal_vs_t: (v) => { const vs=n(v.vs_pct); const f=vs<2?vs:vs/100; return n(v.ts_t)>0 ? Math.round(n(v.ts_t)*f*10000)/10000 : null },

  psa_comp_diff:(v) => Math.round((n(v.psa_hrs)-n(v.comp_hrs))*60),  // diff in minutes
  rbg_total:    (v) => n(v.rbg_d1)+n(v.rbg_d2),
  cbg_tot:      (v) => n(v.cbg_d1)+n(v.cbg_d2),
  tot_disp:     (v) => n(v.veer_kg)+n(v.adinath_kg)+n(v.gail_kg)+n(v.sps_kg)+n(v.other1_kg)+n(v.other2_kg),
  ideal_rbg:    (v) => n(v.psa_hrs)*600,
  ideal_pur:    (v) => n(v.psa_hrs)*370,
  ideal_cbg:    (v) => n(v.psa_hrs)*275,
  psa_eff_psa:  (v) => n(v.psa_hrs)>0 ? ((n(v.cbg_d1)+n(v.cbg_d2))/(n(v.psa_hrs)*PSA_BASIS))*100 : null,

  // IA-PA — TA = IA+PA; ratio = IA÷PA (written to sheet cols 5,9,13,17)
  d1_ta1:    (v) => n(v.d1_pa1)+n(v.d1_ia1),
  d1_ta2:    (v) => n(v.d1_pa2)+n(v.d1_ia2),
  d2_ta1:    (v) => n(v.d2_pa1)+n(v.d2_ia1),
  d2_ta2:    (v) => n(v.d2_pa2)+n(v.d2_ia2),
  d1_iapa1:  (v) => n(v.d1_pa1)>0 ? n(v.d1_ia1)/n(v.d1_pa1) : null,
  d1_iapa2:  (v) => n(v.d1_pa2)>0 ? n(v.d1_ia2)/n(v.d1_pa2) : null,
  d2_iapa1:  (v) => n(v.d2_pa1)>0 ? n(v.d2_ia1)/n(v.d2_pa1) : null,
  d2_iapa2:  (v) => n(v.d2_pa2)>0 ? n(v.d2_ia2)/n(v.d2_pa2) : null,

  // Feedstock Supply totals
  pw_total:    (v) => n(v.pw_lather)+n(v.pw_narwal)+n(v.pw_subhash)+n(v.pw_gk)+n(v.pw_dry)+n(v.pw_nazim),
  cd_total:    (v) => n(v.cd_gharaunda)+n(v.cd_phoosgarh)+n(v.cd_radhakrishna),
  csl_total:   (v) => n(v.csl_sadasat)+n(v.csl_pantnagar)+n(v.csl_virangam),
  pm_total:    (v) => n(v.pm_sonipat)+n(v.pm_malakpur)+n(v.pm_ramala)+n(v.pm_thana)+n(v.pm_tikuala)+
                      n(v.pm_shamli)+n(v.pm_laknour)+n(v.pm_balyan)+n(v.pm_singh)+n(v.pm_naveen)+
                      n(v.pm_gs)+n(v.pm_sbec)+n(v.pm_sahakumbri)+n(v.pm_rathi)+n(v.pm_unn)+n(v.pm_devom)+
                      n(v.pm_vaibhav_ramala),
  fs_total_day:(v) => n(v.pw_lather)+n(v.pw_narwal)+n(v.pw_subhash)+n(v.pw_gk)+n(v.pw_dry)+n(v.pw_nazim)+
                      n(v.cd_gharaunda)+n(v.cd_phoosgarh)+n(v.cd_radhakrishna)+
                      n(v.pm_sonipat)+n(v.pm_malakpur)+n(v.pm_ramala)+n(v.pm_thana)+n(v.pm_tikuala)+
                      n(v.pm_shamli)+n(v.pm_laknour)+n(v.pm_balyan)+n(v.pm_singh)+n(v.pm_naveen)+
                      n(v.pm_gs)+n(v.pm_sbec)+n(v.pm_sahakumbri)+n(v.pm_rathi)+n(v.pm_unn)+n(v.pm_devom)+
                      n(v.pm_vaibhav_ramala)+n(v.carlsberg)+n(v.gs_rcv),

  // Feed & Balance
  fb_tot_cost: (v) => n(v.pm_cost)+n(v.gs_cost)+n(v.csl_cost)+n(v.cd_cost)+n(v.sg_cost),
  fb_tot_fed:  (v) => n(v.pm_fed)+n(v.gs_fed)+n(v.csl_fed)+n(v.cd_fed)+n(v.sg_fed),
  fb_pm_bal:   (v) => n(v.ob_pm) +n(v.pm_rcv)-n(v.pm_fed),
  fb_gs_bal:   (v) => n(v.ob_gs) +n(v.gs_rcv)-n(v.gs_fed),
  fb_csl_bal:  (v) => n(v.ob_csl)+n(v.csl_rcv)-n(v.csl_fed),
  fb_cd_bal:   (v) => n(v.ob_cd) +n(v.cd_rcv)-n(v.cd_fed),
  fb_sg_bal:   (v) => n(v.ob_sg) +n(v.sg_rcv)-n(v.sg_fed),

  // Manure: amount = qty_mt × rate (calc, written to col 6)
  manure_amount:(v) => n(v.qty_mt)*n(v.rate),
  // Sales Detail: total dispatched kg and total revenue
  sales_tot_disp:(v) => n(v.veer_qty)+n(v.adinath_qty)+n(v.gail_qty)+n(v.sps_qty),
  // veer_rate/adinath_rate/gail_rate/sps_rate are TOTAL Rs per customer, not rate/kg
  sales_tot_rs:  (v) => n(v.veer_rate)+n(v.adinath_rate)+n(v.gail_rate)+n(v.sps_rate),
}

function runCalcs(sheet, inp, ds){
  const m = getMonth(ds)
  const out = {}
  for(const sec of sheet.sections){
    for(const f of sec.f){
      if(f.tp!=='calc') continue
      const fn = FN[f.fn]
      if(!fn) continue
      const v = fn(inp,m)
      out[f.k] = (v!==null&&v!==undefined) ? (typeof v==='number'?Math.round(v*100)/100:v) : null
    }
  }
  return out
}

let cur=null, inp={}, drafts={}

function buildNav(){
  const nav=document.getElementById('nav')
  const grps={}
  SHEETS.forEach(s=>{ if(!grps[s.group]) grps[s.group]=[]; grps[s.group].push(s) })
  let html=''
  html+=`<button data-id="_upload" onclick="showUploadView()" class="upl-nav-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Upload Workbook</button>`
  for(const [g,items] of Object.entries(grps)){
    html+=`<div class="ng">${g}</div>`
    items.forEach(s=>{ html+=`<button data-id="${s.id}" onclick="loadSheet('${s.id}')">${s.label}</button>` })
  }
  nav.innerHTML=html
}

function loadSheet(id){
  // Save current section values before switching
  if(cur) drafts[cur.id]=Object.assign({},inp)
  cur=SHEETS.find(s=>s.id===id)
  // Restore draft values for this sheet (persist across section switches)
  inp=Object.assign({},drafts[id]||{})
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id))
  let html=`<div class="sh"><h2>${cur.label}</h2><div class="sub">Sheet: <b>${cur.sheet}</b></div></div>`
  if(cur.hasDate){
    html+=`<div class="date-row"><label>Date</label>
      <input type="date" id="dp" value="${today()}" max="${today()}" oninput="onDateChange()"/>
      <span id="dp-display" style="font-size:.83rem;font-weight:600;color:var(--accent)">${fmtDisplay(today())}</span>
      <span id="dp-err" style="font-size:.77rem;color:#e53935;display:none">Invalid date</span></div>`
  }
  cur.sections.forEach((sec,si)=>{
    html+=`<div class="sec"><div class="sec-title-row"><span class="sec-title">${sec.t}</span><button class="clear-btn" onclick="clearSection('${id}',${si})">Clear</button></div><div class="fgrid">`
    sec.f.forEach(f=>{
      if(f.tp==='info'){
        html+=`<div class="info-row">${f.l}</div>`; return
      }
      const saved=inp[f.k]
      html+=`<div class="fg"><label>${f.l}${f.tp==='calc'?'<span class="atag">auto</span>':''}</label>`
      if(f.tp==='calc'||f.tp==='fetch'){
        html+=`<input type="text" id="f_${f.k}" class="cf" readonly placeholder="—" tabindex="-1"/>`
      } else if(f.tp==='sel'){
        html+=`<select id="f_${f.k}" onchange="onInp('${f.k}',this.value)"><option value="">— select —</option>`
        f.opts.forEach(o=>html+=`<option${saved==o?' selected':''}>${o}</option>`)
        html+=`</select>`
      } else if(f.tp==='txt'){
        html+=`<input type="text" id="f_${f.k}" value="${saved!=null?saved:''}" oninput="onInp('${f.k}',this.value)"/>`
      } else {
        html+=`<input type="number" id="f_${f.k}" step="any" placeholder="0" value="${saved!=null?saved:''}" oninput="onInp('${f.k}',this.value)"/>`
      }
      html+=`</div>`
    })
    html+=`</div></div>`
  })
  document.getElementById('main').innerHTML=html
  recompute()
  if(CAL_QTY_COLS[id]) fetchCalQty(id)
  if(id==='FB') fetchFBPrevBal(today())
}

function onInp(k,v){ inp[k]=v===''?null:(isNaN(v)?v:parseFloat(v)); recompute() }
window.onInp=onInp

function clearSection(sheetId,sectionIndex){
  const sheet=SHEETS.find(s=>s.id===sheetId); if(!sheet) return
  const sec=sheet.sections[sectionIndex]; if(!sec) return
  sec.f.forEach(f=>{
    if(f.tp==='calc'||f.tp==='fetch'||f.tp==='info') return
    delete inp[f.k]
    if(drafts[sheetId]) delete drafts[sheetId][f.k]
    const el=document.getElementById('f_'+f.k); if(!el) return
    if(el.tagName==='SELECT') el.value=''
    else el.value=''
  })
  recompute()
}
window.clearSection=clearSection

function recompute(){
  if(!cur) return
  const ds=document.getElementById('dp')?.value
  const calcs=runCalcs(cur,inp,ds)
  for(const [k,v] of Object.entries(calcs)){
    const el=document.getElementById('f_'+k)
    if(el) el.value=v!==null?v:''
  }
}
window.recompute=recompute

let _msal = null, _token = null, _user = null

async function initMsal(){
  if(_msal) return
  const { PublicClientApplication } = window.msal
  _msal = new PublicClientApplication({
    auth:  { clientId: CONFIG.clientId, authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`, redirectUri: 'https://mohit-sharma2614.github.io/Karnal-Dashboard/portal/index.html', navigateToLoginRequestUrl: false },
    cache: { cacheLocation:'localStorage' },
  })
  await _msal.initialize()
  const result = await _msal.handleRedirectPromise()
  if(result){
    if(!isAllowedAccount(result.account)){
      await _msal.logoutRedirect({ account:result.account })
      return
    }
    _token=result.accessToken
    _user=result.account?.name||result.account?.username
  }
  updateAuthUI()
}

function isAllowedAccount(account){
  if(!account) return false
  const email = (account.username||account.loginHint||'').toLowerCase()
  return CONFIG.allowedUsers.some(u=>u.toLowerCase()===email)
}

async function getToken(){
  if(_token) return _token
  const accounts = _msal.getAllAccounts()
  if(!accounts.length) return null
  const account = accounts[0]
  if(!isAllowedAccount(account)){
    await _msal.logoutRedirect({ account })
    return null
  }
  try{
    const r = await _msal.acquireTokenSilent({ scopes:CONFIG.scopes, account })
    _token=r.accessToken; _user=account.name||account.username
    return _token
  }catch{ await _msal.acquireTokenRedirect({ scopes:CONFIG.scopes }); return null }
}

function updateAuthUI(){
  const accounts = _msal?.getAllAccounts()||[]
  const signedIn = accounts.length>0
  _user = accounts[0]?.name||accounts[0]?.username||_user
  document.getElementById('saveBtn').disabled = !signedIn
  document.getElementById('saveNote').textContent = signedIn ? `Signed in as ${_user}` : 'Sign in to enable saving'
  document.getElementById('banner').style.display = signedIn ? 'none' : ''
  document.getElementById('signBtn').textContent = signedIn ? 'Sign Out' : 'Sign In'
}

window.handleSignIn = async ()=>{
  await initMsal()
  const accounts = _msal.getAllAccounts()
  if(accounts.length){ _msal.logoutRedirect(); return }
  await _msal.loginRedirect({ scopes:CONFIG.scopes })
}

function wbUrl(){ return `https://graph.microsoft.com/v1.0/drives/${CONFIG.driveId}/items/${CONFIG.fileId}/workbook` }

async function gGet(path){
  const t=await getToken(); if(!t) return null
  const r=await fetch(wbUrl()+path,{headers:{Authorization:`Bearer ${t}`}})
  return r.json()
}
async function gPatch(path,body,sessionId){
  const t=await getToken(); if(!t) return null
  const hdrs={Authorization:`Bearer ${t}`,'Content-Type':'application/json'}
  if(sessionId) hdrs['workbook-session-id']=sessionId
  const r=await fetch(wbUrl()+path,{method:'PATCH',headers:hdrs,body:JSON.stringify(body)})
  return r.json()
}
async function getSession(){
  const t=await getToken(); if(!t) return null
  const r=await fetch(wbUrl()+'/createSession',{method:'POST',headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json'},body:JSON.stringify({persistChanges:true})})
  const d=await r.json(); return d.id
}

async function fetchFBPrevBal(ds){
  const keys=['pm','gs','csl','cd','sg']
  keys.forEach(k=>{ inp['ob_'+k]=0; const el=document.getElementById('f_ob_'+k); if(el) el.value='Fetching…' })
  try{
    const serial=toExcelSerial(ds)
    const d=await gGet(`/worksheets('${encodeURIComponent('Feed & Balance')}')/range(address='A3:V500')`)
    const rows=(d&&d.values)||[]
    let lastRow=null
    for(const r of rows){
      const v=r[0]; if(v===null||v===undefined) continue
      let s=null
      if(typeof v==='number') s=Math.round(v)
      else if(typeof v==='string'){
        const iso=v.match(/^(\d{4}-\d{2}-\d{2})/); if(iso) s=toExcelSerial(iso[1])
        const dmy=v.match(/^(\d{2})-(\d{2})-(\d{4})$/); if(dmy) s=toExcelSerial(`${dmy[3]}-${dmy[2]}-${dmy[1]}`)
      }
      if(s!==null && s<serial) lastRow=r
    }
    // Balance cols: idx 17=PM, 18=GS, 19=CSL, 20=CD, 21=SG (0-based in the row array)
    const balIdx={pm:17,gs:18,csl:19,cd:20,sg:21}
    keys.forEach(k=>{
      const val=lastRow ? (parseFloat(lastRow[balIdx[k]])||0) : 0
      inp['ob_'+k]=val
      const el=document.getElementById('f_ob_'+k)
      if(el) el.value=val
    })
    if(!lastRow) keys.forEach(k=>{ const el=document.getElementById('f_ob_'+k); if(el) el.value='0 (no prior data)' })
    recompute()
  } catch(e){
    console.error('fetchFBPrevBal',e)
    keys.forEach(k=>{ const el=document.getElementById('f_ob_'+k); if(el) el.value='Error' })
  }
}

async function fetchCalQty(sheetId){
  const cfg = CAL_QTY_COLS[sheetId]; if(!cfg) return
  const serial = toExcelSerial(today())
  // Find today's row in D1 and D2 (col A = date serial, dataStart=3)
  const [rowD1, rowD2] = await Promise.all([
    findRow('D1', serial, 3),
    findRow('D2', serial, 3),
  ])
  let total = 0
  const reads = []
  if(rowD1) reads.push(gGet(`/worksheets('D1')/range(address='${colLetter(cfg.col)}${rowD1}')`))
  if(rowD2) reads.push(gGet(`/worksheets('D2')/range(address='${colLetter(cfg.col)}${rowD2}')`))
  const results = await Promise.all(reads)
  results.forEach(r=>{ if(r&&r.values&&r.values[0]&&r.values[0][0]) total+=parseFloat(r.values[0][0])||0 })
  if(total>0){
    inp.qty = Math.round(total*1000)/1000
    const el = document.getElementById('f_qty')
    if(el) el.value = inp.qty
    recompute()
  }
}

async function findRow(sheetName, serial, dataStart=3){
  const d=await gGet(`/worksheets('${encodeURIComponent(sheetName)}')/range(address='A${dataStart}:A400')`)
  const rows=(d&&d.values)||[]
  for(let i=0;i<rows.length;i++){
    const v=rows[i][0]; if(v===null||v===undefined) continue
    // Match by serial number (our write format) or by parsed date
    if(typeof v==='number'&&v===serial) return dataStart+i
    if(typeof v==='string'){
      const iso=v.match(/^(\d{4}-\d{2}-\d{2})/); if(iso){ const s=toExcelSerial(iso[1]); if(s===serial) return dataStart+i }
      const dmy=v.match(/^(\d{2})-(\d{2})-(\d{4})$/); if(dmy){ const s=toExcelSerial(`${dmy[3]}-${dmy[2]}-${dmy[1]}`); if(s===serial) return dataStart+i }
    }
  }
  return null
}

window.handleSave = async ()=>{
  await initMsal()
  const t=await getToken()
  if(!t){ toast('Sign in first',true); return }
  if(!cur){ toast('Select a sheet first',true); return }

  // Cal sheets all have hasDate:true now; isCalSheet marks them as append-mode (date→col B).
  // MANURE and MAINT have a date picker and also use append mode (Sl.No in col 1, Date in col 2).
  const isCalSheet   = ['PMCAL','GSCAL','CSLCAL','CDCAL','SGCAL'].includes(cur.id)
  const isAppendSheet = isCalSheet || ['MANURE','MAINT'].includes(cur.id)
  const ds = document.getElementById('dp')?.value || (isCalSheet ? today() : null)
  if(!ds||!isValidDate(ds)){ toast('Enter a valid date first',true); return }

  document.getElementById('saveBtn').disabled=true
  document.getElementById('saveNote').textContent='Saving…'

  try{
    const serial=toExcelSerial(ds)
    const colMap = COLUMN_MAP[cur.id] || {}
    const dateCol = isAppendSheet ? 2 : 1
    const dataStart = cur.dataStart || 3

    const rowData={}
    rowData[dateCol] = serial  // always an Excel serial integer — no locale ambiguity

    // Collect all fields with a known column mapping
    cur.sections.forEach(sec=>sec.f.forEach(f=>{
      const col = colMap[f.k]
      if(!col) return  // no column mapping — browser-calc only, not written
      if(f.tp==='calc'){
        const el=document.getElementById('f_'+f.k)
        if(el&&el.value!=='') rowData[col]=parseFloat(el.value)
      } else {
        const v=inp[f.k]
        if(v!==null&&v!==undefined&&v!=='') rowData[col]=v
      }
    }))

    // MANURE C7 = Month string (e.g. "Jan-2026") — auto-derived from the date picker.
    if(cur.id === 'MANURE') {
      const [y,m] = ds.split('-')
      const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
      rowData[7] = `${MON[parseInt(m,10)-1]}-${y}`
    }

    // PSA C2 (psa_hrs) and C4 (comp_hrs) are time-formatted cells in Excel.
    // Convert decimal hours → Excel time fraction (÷24) before writing.
    // C5 (psa_comp_diff) is minutes → convert to time fraction (÷60÷24).
    if(cur.id === 'PSA') {
      if(rowData[2]) rowData[2] = rowData[2] / 24
      if(rowData[4]) rowData[4] = rowData[4] / 24
      if(rowData[5]) rowData[5] = rowData[5] / 60 / 24
    }

    const sn=cur.sheet

    if(!sn){
      toast('This sheet has no direct save path — use the master workbook directly.',true)
      return
    }

    // ── Special: Monthly Fixed Costs (month-column structure) ────────────────
    if(cur.id==='FIXED'){
      const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December']
      const DAYS=[31,28,31,30,31,30,31,31,30,31,30,31]  // 2026 non-leap
      const CUM=[0,31,59,90,120,151,181,212,243,273,304,334]
      const mName=inp['month']; const mIdx=MONTHS.indexOf(mName)
      if(mIdx<0){ toast('Select a month first',true); return }
      const kvah=parseFloat(inp['elec_kvah'])||null
      const bill=parseFloat(inp['elec_bill'])||null
      if(!bill){ toast('Enter Electricity Bill (₹) at minimum',true); return }
      const monthCol=mIdx+4   // D=Jan=col4, E=Feb=col5 ... O=Dec=col15
      const colL=colLetter(monthCol)
      const sessionId=await getSession()
      const FC=encodeURIComponent('Monthly Fixed Costs')
      const RC=encodeURIComponent('Daily Revenue & Costs')
      const writes=[]
      if(kvah) writes.push(gPatch(`/worksheets('${FC}')/range(address='${colL}4')`,{values:[[kvah]]},sessionId))
      writes.push(gPatch(`/worksheets('${FC}')/range(address='${colL}5')`,{values:[[bill]]},sessionId))
      // Update Daily Revenue & Costs col H (electricity per day) for all days in month
      const days=DAYS[mIdx]
      const firstRow=4+CUM[mIdx]
      const daily=Math.round((bill/days)*100)/100
      const vals=Array.from({length:days},()=>[daily])
      writes.push(gPatch(`/worksheets('${RC}')/range(address='H${firstRow}:H${firstRow+days-1}')`,{values:vals},sessionId))
      const results=await Promise.all(writes)
      const err=results.find(r=>r&&r.error)
      if(err) toast(`Save failed: ${err.error.message}`,true)
      else {
        toast(`Saved electricity for ${mName}: ₹${bill.toLocaleString('en-IN')} → Monthly Fixed Costs + Daily Revenue & Costs updated`)
        const mSerial=toExcelSerial(`2026-${String(mIdx+1).padStart(2,'0')}-01`)
        appendSubmissionLog(mSerial, cur.label, sessionId).catch(()=>{})
      }
      return
    }
    // ── End special FIXED ────────────────────────────────────────────────────

    let rowNum

    if(isAppendSheet){
      // Append sheets: always add a new row — multiple entries per day are allowed.
      // Date is in col B (2); col A (1) holds auto Sl.No / Sr.No.
      const d=await gGet(`/worksheets('${encodeURIComponent(sn)}')/range(address='B${dataStart}:B500')`)
      const rows=(d&&d.values)||[]
      let last=dataStart-1
      for(let i=rows.length-1;i>=0;i--){ if(rows[i][0]!==null&&rows[i][0]!==''){ last=dataStart+i; break } }
      // Auto-assign Sr.No in col A
      rowData[1] = last - dataStart + 2
      rowNum = last+1
    } else {
      rowNum = await findRow(sn, serial, dataStart)
      if(!rowNum){
        // New date — append after last filled row
        const d=await gGet(`/worksheets('${encodeURIComponent(sn)}')/range(address='A${dataStart}:A400')`)
        const rows=(d&&d.values)||[]
        let last=dataStart-1
        for(let i=rows.length-1;i>=0;i--){ if(rows[i][0]!==null&&rows[i][0]!==''){ last=dataStart+i; break } }
        rowNum=last+1
      }
    }

    const maxCol=Math.max(...Object.keys(rowData).map(Number),60)
    const values=Array(maxCol).fill(null)
    for(const[c,v]of Object.entries(rowData)) values[parseInt(c)-1]=v??null

    const sessionId=await getSession()
    const range=`A${rowNum}:${colLetter(maxCol)}${rowNum}`
    const res=await gPatch(`/worksheets('${encodeURIComponent(sn)}')/range(address='${range}')`,{values:[values]},sessionId)

    if(res&&res.error){ toast(`Save failed: ${res.error.message}`,true) }
    else {
      toast(`Saved to ${sn} row ${rowNum} (${fmtDisplay(ds)})`)
      appendSubmissionLog(serial, cur.label, sessionId).catch(()=>{})
    }
  }catch(e){ toast(`Error: ${e.message}`,true) }
  finally{
    document.getElementById('saveBtn').disabled=false
    document.getElementById('saveNote').textContent=`Signed in as ${_user}`
  }
}

async function appendSubmissionLog(dateSerial, sheetLabel, sessionId){
  const SL = encodeURIComponent('Submission Log')
  const d  = await gGet(`/worksheets('${SL}')/range(address='A3:A202')`)
  const rows = (d&&d.values)||[]
  let last = 2
  for(let i=rows.length-1;i>=0;i--){ if(rows[i][0]!==null&&rows[i][0]!==''){ last=3+i; break } }
  const rowNum = last+1
  const accounts = _msal?.getAllAccounts()||[]
  const email = accounts[0]?.username||''
  const name  = _user||email
  const now   = new Date()
  const ts    = `${now.getDate().toString().padStart(2,'0')}-${now.toLocaleString('en',{month:'short'})}-${now.getFullYear()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`
  await gPatch(`/worksheets('${SL}')/range(address='A${rowNum}:E${rowNum}')`,
    {values:[[dateSerial, sheetLabel, name, email, ts]]}, sessionId)
}

function colLetter(n){ let s=''; while(n>0){n--;s=String.fromCharCode(65+(n%26))+s;n=Math.floor(n/26)} return s }

function today(){
  // Use local date components — toISOString() returns UTC which can be 1 day behind in IST at midnight
  const d = new Date()
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
}

function onDateChange(){
  const el = document.getElementById('dp')
  const ds = el?.value
  const errEl = document.getElementById('dp-err')
  const dispEl = document.getElementById('dp-display')
  if(!isValidDate(ds)){
    if(errEl){ errEl.textContent='Invalid date'; errEl.style.display='inline' }
    if(dispEl) dispEl.textContent=''
    return
  }
  if(ds < today()){
    if(errEl){ errEl.textContent='Past dates are not allowed. Only today\'s data can be entered.'; errEl.style.display='inline' }
    if(dispEl) dispEl.textContent=''
    if(el) el.value = today()
    setTimeout(()=>{ if(errEl) errEl.style.display='none'; onDateChange() }, 2000)
    return
  }
  if(errEl) errEl.style.display='none'
  const serial = toExcelSerial(ds)
  const roundtrip = fromExcelSerial(serial)
  // Round-trip check: serial → date must equal original to catch any conversion error
  if(roundtrip !== ds){
    if(errEl){ errEl.textContent=`Date conversion error (${roundtrip})`; errEl.style.display='inline' }
    return
  }
  if(dispEl) dispEl.textContent=`${fmtDisplay(ds)}  ·  serial ${serial}`
  recompute()
}

function parseUplWorkbook(){
  _uplParsed   = {}
  _uplRejected = {}

  // Fix 6: accept dates within [today-60, today+7]
  const now     = new Date()
  const minSer  = dateToSerial(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 60))
  const maxSer  = dateToSerial(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 7))

  for(const sName of _uplWb.SheetNames){
    const cfg = UPL_CFG[sName]
    if(!cfg) continue
    const cm = COLUMN_MAP[cfg.cmKey]
    if(!cm) continue
    const ws = _uplWb.Sheets[sName]
    const all = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null})
    const dataRows = all.slice(cfg.dataStart - 1)
    const rows = []
    let rejected = 0

    for(const row of dataRows){
      if(!row || row.length === 0) continue
      const rawDate = row[cfg.dateCol - 1]
      if(rawDate == null || rawDate === '') continue
      let serial
      if(typeof rawDate === 'number' && rawDate > 40000 && rawDate < 50000){
        serial = Math.round(rawDate)
      } else if(typeof rawDate === 'string'){
        const m = rawDate.match(/^(\d{4}-\d{2}-\d{2})/)
        if(m) serial = toExcelSerial(m[1])
        else {
          const dmy = rawDate.match(/^(\d{2})[\/-](\d{2})[\/-](\d{4})$/)
          if(dmy) serial = toExcelSerial(`${dmy[3]}-${dmy[2]}-${dmy[1]}`)
        }
      }
      if(!serial) continue

      // Fix 6: reject out-of-window dates
      if(serial < minSer || serial > maxSer){ rejected++; continue }

      const dateStr = fromExcelSerial(serial)
      if(!dateStr) continue
      const rowData = {[cfg.dateCol]: serial}
      for(const [key, col] of Object.entries(cm)){
        const v = row[col - 1]
        if(v != null && v !== '') rowData[col] = v
      }
      rows.push({serial, dateStr, rowData})
    }
    if(rows.length > 0) _uplParsed[sName] = rows
    if(rejected > 0) _uplRejected[sName] = rejected
  }
}

function uplLog(msg, isErr=false){
  const el = document.getElementById('uplProgress')
  if(!el) return
  el.style.display = 'block'

}

async function submitUpload(){
  await initMsal()
  const t = await getToken()
  if(!t){ toast('Sign in first', true); return }

  const btn      = document.getElementById('uplSubmitBtn')
  const mode     = document.getElementById('uplConflictMode')?.value || 'overwrite'
  const logEl    = document.getElementById('uplProgress')
  if(btn) btn.disabled = true
  if(logEl){ logEl.style.display='block'; logEl.innerHTML='' }

  let totalWritten=0, totalSkipped=0, totalDupSkipped=0, totalErrors=0
  const sheetsWritten = []  // Fix 2: track partial state

  // Fix 3: collect date range for audit log
  const allDates = Object.values(_uplParsed).flat().map(r=>r.dateStr).sort()
  const dateRangeStr = allDates.length
    ? (allDates[0]===allDates[allDates.length-1] ? allDates[0] : `${allDates[0]}→${allDates[allDates.length-1]}`)
    : 'no dates'

  try {
    const sid = await getSession()

    // Fix 2 + Fix 3: write UPLOAD START to submission log before touching any sheet
    const uploadLabel = `[UPLOAD START] ${_uplFile.name} | ${dateRangeStr} | ${Object.keys(_uplParsed).join(', ')}`
    await appendSubmissionLog(allDates[0] ? toExcelSerial(allDates[0]) : 0, uploadLabel, sid).catch(()=>{})

    for(const [sName, rows] of Object.entries(_uplParsed)){
      const cfg = UPL_CFG[sName]
      const cm  = COLUMN_MAP[cfg.cmKey]
      uplLog(`▶ ${sName} — ${rows.length} row${rows.length===1?'':'s'}`)

      // Fix 4: for append sheets, pre-fetch existing keys (date+dupCols) to detect duplicates
      let existingKeys = new Set()
      if(cfg.append && cfg.dupCols){
        try {
          const enc = encodeURIComponent(sName)
          const dc  = cfg.dateCol
          // fetch date col + first 2 dup cols
          const endCol = Math.max(dc, ...cfg.dupCols)
          const d = await gGet(`/worksheets('${enc}')/range(address='${colLetter(1)}${cfg.dataStart}:${colLetter(endCol)}600')`)
          const existRows = (d&&d.values)||[]
          for(const er of existRows){
            const dateV = er[dc-1]
            if(dateV==null || dateV==='') continue
            const key = [dateV, ...cfg.dupCols.filter(c=>c!==dc).map(c=>String(er[c-1]||'').trim().toLowerCase())].join('|')
            existingKeys.add(key)
          }
          uplLog(`  (loaded ${existingKeys.size} existing keys for dup-check)`)
        } catch(e){ uplLog(`  (dup-check pre-fetch failed: ${e.message} — will append all)`) }
      }

      for(let i=0; i<rows.length; i++){
        const {serial, dateStr, rowData} = rows[i]

        try {
          const enc = encodeURIComponent(sName)
          let rowNum

          if(cfg.append){
            // Fix 4: check duplicate by date+sample+location key
            if(cfg.dupCols){
              const key = [serial, ...cfg.dupCols.filter(c=>c!==cfg.dateCol).map(c=>String(rowData[c]||'').trim().toLowerCase())].join('|')
              if(existingKeys.has(key)){
                uplLog(`  [${i+1}/${rows.length}] ${dateStr} → Dup skip (${String(rowData[cfg.dupCols[1]]||'').slice(0,20)})`)
                totalDupSkipped++; continue
              }
              existingKeys.add(key) // prevent dup within same upload batch
            }
            const dc = cfg.dateCol
            const d = await gGet(`/worksheets('${enc}')/range(address='${colLetter(dc)}${cfg.dataStart}:${colLetter(dc)}600')`)
            const existRows = (d&&d.values)||[]
            let last = cfg.dataStart - 1
            for(let j=existRows.length-1; j>=0; j--){
              if(existRows[j][0]!=null && existRows[j][0]!==''){ last=cfg.dataStart+j; break }
            }
            rowData[1] = last - cfg.dataStart + 2  // auto Sr.No
            rowNum = last + 1
          } else {
            rowNum = await findRow(sName, serial, cfg.dataStart)
            if(rowNum && mode === 'skip'){
              uplLog(`  [${i+1}/${rows.length}] ${dateStr} → Skipped (row ${rowNum} exists)`)
              totalSkipped++; continue
            }
            if(!rowNum){
              const d = await gGet(`/worksheets('${enc}')/range(address='A${cfg.dataStart}:A400')`)
              const existRows = (d&&d.values)||[]
              let last = cfg.dataStart - 1
              for(let j=existRows.length-1; j>=0; j--){
                if(existRows[j][0]!=null && existRows[j][0]!==''){ last=cfg.dataStart+j; break }
              }
              rowNum = last + 1
            }
          }

          // PSA: convert decimal hours → Excel time fraction
          if(sName === 'PSA Production'){
            if(rowData[2]) rowData[2] = rowData[2] / 24
            if(rowData[4]) rowData[4] = rowData[4] / 24
            if(rowData[5]) rowData[5] = rowData[5] / 60 / 24
          }
          // Manure: auto-derive Month string for col 6 (master col structure: Date=1,VType=2,Farmer=3,Type=4,Amount=5,Month=6)
          if(sName === 'Manure Sales'){
            const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
            const ds2 = fromExcelSerial(serial)
            if(ds2){ const [y,m]=ds2.split('-'); rowData[6]=`${MON[parseInt(m,10)-1]}-${y}` }
          }

          const maxCol = Math.max(...Object.keys(rowData).map(Number), 10)
          const values = Array(maxCol).fill(null)
          for(const [c,v] of Object.entries(rowData)) values[parseInt(c)-1] = v??null

          const range = `A${rowNum}:${colLetter(maxCol)}${rowNum}`
          const res = await gPatch(`/worksheets('${enc}')/range(address='${range}')`, {values:[values]}, sid)

          if(res && res.error){
            uplLog(`  [${i+1}/${rows.length}] ${dateStr} → ERROR: ${res.error.message}`, true)
            totalErrors++
          } else {
            uplLog(`  [${i+1}/${rows.length}] ${dateStr} → Row ${rowNum} ✓`)
            totalWritten++
          }
        } catch(e){
          uplLog(`  [${i+1}/${rows.length}] ${dateStr} → ERROR: ${e.message}`, true)
          totalErrors++
        }
      }
      sheetsWritten.push(sName)  // Fix 2: record this sheet completed
    }

    uplLog(``)
    uplLog(`═ Done: ${totalWritten} written  ${totalSkipped} skipped  ${totalDupSkipped} dup-skipped  ${totalErrors} error${totalErrors===1?'':'s'} ═`)

    // Fix 2 + Fix 3: write UPLOAD COMPLETE to submission log with full summary
    const status = totalErrors === 0 ? 'COMPLETE' : `PARTIAL (${totalErrors} errors)`
    const endLabel = `[UPLOAD ${status}] ${_uplFile.name} | ${dateRangeStr} | written:${totalWritten} skipped:${totalSkipped+totalDupSkipped} errors:${totalErrors}`
    await appendSubmissionLog(allDates[0] ? toExcelSerial(allDates[0]) : 0, endLabel, sid).catch(()=>{})

    if(totalErrors === 0) toast(`Transfer complete — ${totalWritten} row${totalWritten===1?'':'s'} written to master workbook`)
    else toast(`Transfer done with ${totalErrors} error${totalErrors===1?'':'s'} — see log`, true)

  } catch(e){
    // Fix 2: log failure state so partial writes are traceable
    uplLog(`Fatal: ${e.message}`, true)
    const sid2 = await getSession().catch(()=>null)
    if(sid2){
      const failLabel = `[UPLOAD FAILED] ${_uplFile.name} | ${dateRangeStr} | sheets completed before failure: ${sheetsWritten.join(', ')||'none'} | error: ${e.message}`
      await appendSubmissionLog(allDates[0] ? toExcelSerial(allDates[0]) : 0, failLabel, sid2).catch(()=>{})
    }
    toast(`Upload failed: ${e.message}`, true)
  } finally {
    if(btn){ btn.disabled=false; btn.textContent='Upload Again' }
  }
}

window.showUploadView = showUploadView
window.onUplDrop = onUplDrop
window.onUplFileSelect = onUplFileSelect
window.submitUpload = submitUpload
</script>
</body>
</html>
