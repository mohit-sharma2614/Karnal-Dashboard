// Build fieldKey → 1-based col index from an uploaded sheet's header row.
// nameMap: { fieldKey: 'Header Name' } or { fieldKey: 'Header Name~N' } for Nth occurrence.
function buildCmFromHeaders(hrow, nameMap){
  const hdrs = {}
  hrow.forEach((h, i) => {
    const s = String(h||'').trim()
    if(!s) return
    if(!hdrs[s]) hdrs[s] = []
    hdrs[s].push(i + 1) // 1-based
  })
  const cm = {}
  for(const [key, spec] of Object.entries(nameMap)){
    const tilde = spec.indexOf('~')
    const hdr = tilde >= 0 ? spec.slice(0, tilde) : spec
    const n   = tilde >= 0 ? parseInt(spec.slice(tilde + 1)) : 1
    const cols = hdrs[hdr]
    if(cols && cols.length >= n) cm[key] = cols[n - 1]
  }
  return cm
}

function parseUplWorkbook(){
  _uplParsed   = {}
  _uplRejected = {}

  // Accept dates within [today-60, today] — no future dates
  const now     = new Date()
  const minSer  = dateToSerial(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 60))
  const maxSer  = dateToSerial(new Date(now.getFullYear(), now.getMonth(), now.getDate()))

  for(const sName of _uplWb.SheetNames){
    const cfg = UPL_CFG[sName]
    if(!cfg) continue
    const nameMap = COLUMN_NAME_MAP[cfg.cmKey]
    if(!nameMap) continue
    const ws = _uplWb.Sheets[sName]
    const all = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null})
    const cm = buildCmFromHeaders(all[cfg.dataStart - 2] || [], nameMap)
    const dataRows = all.slice(cfg.dataStart - 1)
    const rows = []
    let rejected = 0

    for(const row of dataRows){
      if(!row || row.length === 0) continue
      const rawDate = row[0]  // date always in col A (index 0) of input workbook
      if(rawDate == null || rawDate === '') continue
      let serial
      if(typeof rawDate === 'number' && rawDate > 40000 && rawDate < 50000){
        serial = Math.round(rawDate)
      } else if(typeof rawDate === 'string'){
        const m = rawDate.match(/^(\d{4}-\d{2}-\d{2})/)
        if(m) serial = toExcelSerial(m[1])
        else {
          const dmy = rawDate.match(/^(\d{2})[\/-](\d{2})[\/-](\d{4})$/)
          if(dmy) serial = toExcelSerial(`${dmy[3]}-${dmy[2]}-${dmy[1]}`)
        }
      }
      if(!serial) continue

      // Fix 6: reject out-of-window dates
      if(serial < minSer || serial > maxSer){ rejected++; continue }

      const dateStr = fromExcelSerial(serial)
      if(!dateStr) continue
      // Store rowData by FIELD KEY (not input col number) so submitUpload can
      // resolve the MASTER column position independently via getColByName.
      const rowData = {}
      for(const [key, col] of Object.entries(cm)){
        const v = row[col - 1]
        if(v != null && v !== '') rowData[key] = v
      }
      rows.push({serial, dateStr, rowData})
    }
    if(rows.length > 0) _uplParsed[sName] = rows
    else {
      // Track WHY this recognised sheet produced 0 rows — for visibility in preview
      const reason = dataRows.filter(r=>r&&r.length>0).length === 0
        ? 'empty sheet'
        : rejected > 0
          ? `all ${rejected} rows outside date window (last 60 days)`
          : 'no valid dates found'
      _uplRejected[sName] = _uplRejected[sName] || 0
      _uplRejected[`__reason__${sName}`] = reason
    }
    if(rejected > 0) _uplRejected[sName] = rejected
  }
}

function renderUplPreview(){
  const previewEl = document.getElementById('uplPreview')
  if(!previewEl) return
  const recognized = Object.keys(_uplParsed)
  const unknown = (_uplWb.SheetNames||[]).filter(s => !UPL_CFG[s])

  if(recognized.length === 0){
    const rejTotal = Object.values(_uplRejected).filter(v=>typeof v==='number').reduce((a,b)=>a+b,0)
    previewEl.style.display = 'block'
    previewEl.innerHTML = `<div class="sec">
      <div class="sec-title-row"><span class="sec-title" style="color:var(--danger)">No recognised sheets found</span></div>
      <p style="color:var(--muted);font-size:.9rem">
        Sheets in file: ${(_uplWb.SheetNames||[]).join(', ')}<br>
        Expected: D1, D2, PSA Production, Pressmud Cal., etc.
        ${rejTotal>0 ? `<br><strong style="color:var(--danger)">${rejTotal} rows rejected — dates outside last 60 days.</strong>` : ''}
      </p>
      <button class="clear-btn" onclick="showUploadView()" style="margin-top:8px">Try another file</button>
    </div>`
    return
  }

  // ── Fix 1: Date coverage cross-check for date-row sheets ────────────
  const drSheets = recognized.filter(s => DATE_ROW_SHEETS.has(s))
  let gapHtml = ''
  if(drSheets.length > 1){
    // Union of all dates across date-row sheets
    const allDates = new Set()
    drSheets.forEach(s => _uplParsed[s].forEach(r => allDates.add(r.dateStr)))
    const sortedDates = [...allDates].sort()
    const hasGaps = drSheets.some(s => {
      const sheetDates = new Set(_uplParsed[s].map(r=>r.dateStr))
      return sortedDates.some(d => !sheetDates.has(d))
    })
    if(hasGaps){
      gapHtml = `<div style="background:#fff3cd;border:1px solid #ffc107;border-radius:6px;padding:10px 14px;margin-bottom:16px;font-size:.82rem">
        <strong style="color:#856404">⚠ Date gap detected across sheets</strong>
        <div style="margin-top:6px;overflow-x:auto">
        <table class="upl-tbl"><thead><tr><th>Sheet</th>${sortedDates.map(d=>`<th style="font-size:.72rem">${d.slice(5)}</th>`).join('')}</tr></thead><tbody>`
      drSheets.forEach(s => {
        const sheetDates = new Set(_uplParsed[s].map(r=>r.dateStr))
        gapHtml += `<tr><td style="font-weight:600">${s}</td>${sortedDates.map(d =>
          sheetDates.has(d)
            ? `<td style="text-align:center;color:var(--success)">✓</td>`
            : `<td style="text-align:center;color:var(--danger);font-weight:700">✗</td>`
        ).join('')}</tr>`
      })
      gapHtml += `</tbody></table></div>
        <div style="margin-top:6px;color:#856404">Missing dates will create gaps in the master workbook. Consider completing those sheets before uploading.</div>
      </div>`
    }
  }

  // ── Fix 7: Manure Sales validation — use COLUMN_NAME_MAP to find vehicle type and type cols
  let manureWarnHtml = ''
  if(_uplParsed['Manure Sales']){
    const unknownVTypes = new Set()
    const unknownTypes  = new Set()
    const manureCfg = UPL_CFG['Manure Sales']
    const manureWS  = _uplWb.Sheets['Manure Sales']
    const manureAll = XLSX.utils.sheet_to_json(manureWS, {header:1, raw:true, defval:null})
    const cm = buildCmFromHeaders(manureAll[manureCfg.dataStart - 2] || [], COLUMN_NAME_MAP[manureCfg.cmKey])
    const vtCol  = cm['v_type']
    const typeCol = cm['type']
    _uplParsed['Manure Sales'].forEach(({rowData}) => {
      const vt = String(rowData['v_type']||'').trim()
      const mt = String(rowData['type']||'').trim()
      if(vt && !KNOWN_MANURE.vehicleTypes.includes(vt)) unknownVTypes.add(vt)
      if(mt && !KNOWN_MANURE.manureTypes.includes(mt))  unknownTypes.add(mt)
    })
    if(unknownVTypes.size || unknownTypes.size){
      manureWarnHtml = `<div style="background:#fff3cd;border:1px solid #ffc107;border-radius:6px;padding:10px 14px;margin-bottom:16px;font-size:.82rem">
        <strong style="color:#856404">⚠ Manure Sales — unknown values detected</strong><br>
        ${unknownVTypes.size ? `Vehicle types not in master list: <em>${[...unknownVTypes].join(', ')}</em><br>` : ''}
        ${unknownTypes.size  ? `Manure types not in master list: <em>${[...unknownTypes].join(', ')}</em>` : ''}
        <div style="margin-top:4px;color:#856404">These will be uploaded as-is. Check spelling to avoid duplicate entries in analytics.</div>
      </div>`
    }
  }

  // ── Fix 6: Rejected rows warning ────────────────────────────────────
  let rejHtml = ''
  const rejEntries = Object.entries(_uplRejected).filter(([s,c])=>typeof c==='number')
  if(rejEntries.length){
    rejHtml = `<div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:6px;padding:10px 14px;margin-bottom:16px;font-size:.82rem">
      <strong style="color:var(--danger)">Rows rejected (dates outside last 60 days or future):</strong>
      ${rejEntries.map(([s,c])=>`<span style="margin-left:10px">${s}: <b>${c}</b></span>`).join('')}
    </div>`
  }

  let html = gapHtml + manureWarnHtml + rejHtml

  // ── Summary cards ────────────────────────────────────────────────────
  html += `<div class="sec"><div class="sec-title-row"><span class="sec-title">File: ${_uplFile.name}</span></div>
    <div class="upl-sheet-grid">`
  for(const [sName, rows] of Object.entries(_uplParsed)){
    const dates = rows.map(r=>r.dateStr)
    const first = dates[0], last = dates[dates.length-1]
    const cfg = UPL_CFG[sName]
    html += `<div class="upl-sheet-card">
      <div class="upl-sc-name">${sName}</div>
      <div class="upl-sc-rows">${rows.length} row${rows.length===1?'':'s'}</div>
      <div class="upl-sc-dates">${first===last ? first : `${first} → ${last}`}</div>
      <div class="upl-sc-mode">${cfg.append ? 'Append (dup-safe)' : 'Date-indexed'}</div>
    </div>`
  }
  html += `</div>`
  if(unknown.length > 0) html += `<div style="margin-top:10px;font-size:.83rem;color:var(--muted)">Sheets skipped (not in schema): ${unknown.join(', ')}</div>`
  const zeroRows = _uplWb.SheetNames.filter(s => UPL_CFG[s] && !_uplParsed[s])
  if(zeroRows.length > 0) html += `<div style="margin-top:8px;font-size:.83rem;color:var(--danger)">⚠ Recognised but 0 rows written: ${zeroRows.map(s=>{const r=_uplRejected[`__reason__${s}`]; return `<strong>${s}</strong>${r?` (${r})`:''}`}).join(', ')}</div>`
  html += `</div>`

  // ── Per-sheet data preview ───────────────────────────────────────────
  for(const [sName, rows] of Object.entries(_uplParsed)){
    const _cfg2 = UPL_CFG[sName]
    const _ws2  = _uplWb.Sheets[sName]
    const _all2 = XLSX.utils.sheet_to_json(_ws2, {header:1, raw:true, defval:null})
    const cm = buildCmFromHeaders(_all2[_cfg2.dataStart - 2] || [], COLUMN_NAME_MAP[_cfg2.cmKey])
    const keys = Object.keys(cm)
    const showRows = rows.length > 10 ? rows.slice(-10) : rows
    const hiddenCount = rows.length - showRows.length
    html += `<div class="sec"><div class="sec-title-row">
      <span class="sec-title">${sName}</span>
      <span style="font-size:.8rem;color:var(--muted)">${rows.length} rows</span></div>
      <div style="overflow-x:auto"><table class="upl-tbl"><thead><tr>
        <th>Date</th>${keys.map(k=>`<th>${k}</th>`).join('')}
      </tr></thead><tbody>`
    if(hiddenCount > 0) html += `<tr><td colspan="${keys.length+1}" style="text-align:center;color:var(--muted);font-style:italic">… ${hiddenCount} earlier rows not shown (last 10 of ${rows.length})</td></tr>`
    // PSA time-fraction keys: stored as hrs÷24 in Excel, display as hours
    const PSA_HRS_KEYS = new Set(['psa_hrs','comp_hrs'])
    showRows.forEach(({dateStr,rowData})=>{
      html += `<tr><td>${dateStr}</td>${keys.map(k=>{
        let v = rowData[k]
        if(v == null) return `<td>—</td>`
        if(PSA_HRS_KEYS.has(k) && typeof v === 'number'){
          // convert Excel time fraction → hours for display
          v = (Math.round(v * 24 * 100) / 100) + ' hrs'
        } else if(typeof v === 'number' && !Number.isInteger(v)){
          // round long floats to 4 dp for readability
          v = Math.round(v * 10000) / 10000
        }
        return `<td>${v}</td>`
      }).join('')}</tr>`
    })
    html += `</tbody></table></div></div>`
  }

  // ── Write options ────────────────────────────────────────────────────
  const totalRows = Object.values(_uplParsed).reduce((a,r)=>a+r.length,0)
  html += `<div class="sec"><div class="sec-title-row"><span class="sec-title">Write Options</span></div>
    <div class="fgrid"><div class="fg">
      <label>Conflict Handling <span style="font-size:.78rem;color:var(--muted)">(date-indexed sheets only)</span></label>
      <select id="uplConflictMode">
        <option value="overwrite">Overwrite existing rows</option>
        <option value="skip">Skip existing dates</option>
      </select>
    </div></div>
    <div style="margin-top:10px;font-size:.8rem;color:var(--muted)">
      ℹ Calc columns are never written regardless of what is in the file.
      Append sheets skip rows where date + sample/location already exist in master.
      This upload will be recorded in Submission Log with your email and file name.
    </div>
    <div id="uplProgress" style="display:none;margin-top:12px"></div>
    <div style="margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <button type="button" class="save-btn" onclick="submitUpload()" id="uplSubmitBtn">
        Transfer to Master Workbook (${recognized.length} sheet${recognized.length===1?'':'s'}, ${totalRows} rows)
      </button>
      <button type="button" class="clear-btn" onclick="showUploadView()">&#8617; Start Over</button>
    </div></div>`

  previewEl.style.display = 'block'
  previewEl.innerHTML = html
  // Scroll so user sees the top of the preview immediately
  previewEl.scrollIntoView({behavior:'smooth', block:'start'})
}

function uplLog(msg, isErr=false){
  const el = document.getElementById('uplProgress')
  if(!el) return
  el.style.display = 'block'
  const line = document.createElement('div')
  line.className = isErr ? 'upl-log-err' : 'upl-log-ok'
  line.textContent = msg
  el.appendChild(line)
  el.scrollTop = el.scrollHeight
}

async function submitUpload(){
  // Show progress bar immediately so any error is visible
  const btn   = document.getElementById('uplSubmitBtn')
  const logEl = document.getElementById('uplProgress')
  if(btn) btn.disabled = true
  if(logEl){ logEl.style.display='block'; logEl.innerHTML=''; setTimeout(()=>logEl.scrollIntoView({behavior:'smooth',block:'start'}),50) }

  if(!_uplParsed || Object.keys(_uplParsed).length===0){
    uplLog('ERROR: No upload data — please re-select the file', true)
    toast('No upload data — please select and parse a file first', true)
    if(btn){ btn.disabled=false }
    return
  }
  // Diagnostic: show what was parsed
  uplLog(`Sheets to upload: ${Object.entries(_uplParsed).map(([k,v])=>`${k}(${v.length} rows)`).join(', ')}`)

  uplLog('Authenticating…')
  let t
  try{
    await initMsal()
    t = await getToken()
  } catch(authErr){
    uplLog(`Auth error: ${authErr.message}`, true)
    toast(`Authentication failed: ${authErr.message}`, true)
    if(btn){ btn.disabled=false }
    return
  }
  if(!t){
    uplLog('ERROR: Not signed in — please sign in and try again', true)
    toast('Sign in first', true)
    if(btn){ btn.disabled=false }
    return
  }
  uplLog('Authenticated ✓')

  // Advance stepper to step 3
  const s2=document.getElementById('uplStep2'), s3=document.getElementById('uplStep3')
  if(s2){s2.classList.remove('active');s2.classList.add('done')}
  if(s3){s3.classList.add('active')}

  const mode = document.getElementById('uplConflictMode')?.value || 'overwrite'

  let totalWritten=0, totalSkipped=0, totalDupSkipped=0, totalErrors=0
  const sheetsWritten = []  // Fix 2: track partial state

  // Fix 3: collect date range for audit log
  const allDates = Object.values(_uplParsed).flat().map(r=>r.dateStr).sort()
  const dateRangeStr = allDates.length
    ? (allDates[0]===allDates[allDates.length-1] ? allDates[0] : `${allDates[0]}→${allDates[allDates.length-1]}`)
    : 'no dates'

  try {
    uplLog('Opening workbook session…')
    const sid = await getSession()
    uplLog(sid ? `Session opened ✓ (${sid.substring(0,12)}…)` : 'No session (will write without session) ⚠️')

    // Verify master workbook is reachable — list sheet names
    try {
      const wsList = await gGet('/worksheets?$select=name', sid)
      const names = (wsList&&wsList.value||[]).map(w=>w.name)
      uplLog(`Master sheets (${names.length}): ${names.join(', ')}`)
    } catch(e) {
      uplLog(`⚠️ Cannot list master sheets: ${e.message} — uploads may fail`, true)
    }

    // Fix 2 + Fix 3: write UPLOAD START to submission log before touching any sheet
    const uploadLabel = `[UPLOAD START] ${_uplFile.name} | ${dateRangeStr} | ${Object.keys(_uplParsed).join(', ')}`
    await appendSubmissionLog(allDates[0] ? toExcelSerial(allDates[0]) : 0, uploadLabel, sid).catch(()=>{})

    // Pre-resolve Manure month col via column names
    let _manureMonthCol = null
    if(_uplParsed['Manure Sales']){
      const m = SHEET_META.MANURE
      _manureMonthCol = await getColByName(m.masterSheet, m.hrow, 'Month')
    }

    for(const [sName, rows] of Object.entries(_uplParsed)){
      const cfg = UPL_CFG[sName]
      const mSheet = cfg.masterSheet || sName
      const meta = SHEET_META[cfg.cmKey]
      const nameMap = COLUMN_NAME_MAP[cfg.cmKey]
      uplLog(`▶ ${sName} — ${rows.length} row${rows.length===1?'':'s'}`)

      // Resolve MASTER column positions for every field key (one cached gGet per sheet)
      let masterCols = {}  // { fieldKey: 1-based master col num }
      try {
        const cacheKey = `${mSheet}:${meta.hrow}`
        if(!_hdrCache[cacheKey]){
          const rh = await gGet(`/worksheets('${encodeURIComponent(mSheet)}')/range(address='${meta.hrow}:${meta.hrow}')`, null)
          const vals = (rh&&rh.values&&rh.values[0]) || []
          const hmap = {}
          vals.forEach((v,i)=>{ if(v!=null&&v!==''){const n=String(v).trim();if(!hmap[n])hmap[n]=[];hmap[n].push(i+1)} })
          _hdrCache[cacheKey] = hmap
        }
        const hmap = _hdrCache[cacheKey]
        for(const [fk, spec] of Object.entries(nameMap)){
          const ti = spec.lastIndexOf('~')
          const name = ti>0&&/^\d+$/.test(spec.slice(ti+1)) ? spec.slice(0,ti) : spec
          const occ  = ti>0&&/^\d+$/.test(spec.slice(ti+1)) ? parseInt(spec.slice(ti+1)) : 1
          const cols = hmap[name]
          if(cols&&cols.length>=occ) masterCols[fk] = cols[occ-1]
        }
        const mappedFields = Object.keys(masterCols).length
        const totalFields = Object.keys(nameMap).length
        uplLog(`  Headers read ✓ — ${mappedFields}/${totalFields} fields mapped${mappedFields===0?' ⚠️ 0 FIELDS — header mismatch!':''}`)
      } catch(e){
        uplLog(`  ERROR resolving master columns for ${mSheet}: ${e.message} — skipping sheet`, true)
        totalErrors += rows.length; continue
      }

      // For append sheets: track within-batch dup keys by field key values
      const batchKeys = new Set()

      for(let i=0; i<rows.length; i++){
        const {serial, dateStr, rowData} = rows[i]

        try {
          const enc = encodeURIComponent(mSheet)
          let rowNum

          if(cfg.append){
            // Within-batch dup detection using field keys
            if(cfg.dupKeys){
              const key = [serial, ...cfg.dupKeys.map(k=>String(rowData[k]||'').trim().toLowerCase())].join('|')
              if(batchKeys.has(key)){
                uplLog(`  [${i+1}/${rows.length}] ${dateStr} → Dup skip`)
                totalDupSkipped++; continue
              }
              batchKeys.add(key)
            }
            // Find last used row in master (scan col A up to 600)
            const d = await gGet(`/worksheets('${enc}')/range(address='A${cfg.dataStart}:A600')`)
            const existRows = (d&&d.values)||[]
            let last = cfg.dataStart - 1
            for(let j=existRows.length-1; j>=0; j--){
              if(existRows[j][0]!=null && existRows[j][0]!==''){ last=cfg.dataStart+j; break }
            }
            rowNum = last + 1
          } else {
            rowNum = await findRow(mSheet, serial, cfg.dataStart)
            if(rowNum && mode === 'skip'){
              uplLog(`  [${i+1}/${rows.length}] ${dateStr} → Skipped (row ${rowNum} exists)`)
              totalSkipped++; continue
            }
            if(!rowNum){
              const d = await gGet(`/worksheets('${enc}')/range(address='A${cfg.dataStart}:A600')`)
              const existRows = (d&&d.values)||[]
              let last = cfg.dataStart - 1
              for(let j=existRows.length-1; j>=0; j--){
                if(existRows[j][0]!=null && existRows[j][0]!==''){ last=cfg.dataStart+j; break }
              }
              rowNum = last + 1
            }
          }

          // Build values array at MASTER column positions
          const colNums = Object.values(masterCols).filter(Boolean)
          const maxCol = colNums.length ? Math.max(...colNums, 1) : 10
          const values = Array(maxCol).fill(null)
          values[0] = serial  // date always in col A of master
          for(const [fk, mc] of Object.entries(masterCols)){
            if(rowData[fk] != null) values[mc - 1] = rowData[fk]
          }

          // Manure: auto-derive Month string at master month column
          if(sName === 'Manure Sales' && _manureMonthCol){
            const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
            const ds2 = fromExcelSerial(serial)
            if(ds2 && _manureMonthCol <= maxCol){
              const [y,m]=ds2.split('-'); values[_manureMonthCol-1]=`${MON[parseInt(m,10)-1]}-${y}`
            }
          }

          const range = `A${rowNum}:${colLetter(maxCol)}${rowNum}`
          const res = await gPatch(`/worksheets('${enc}')/range(address='${range}')`, {values:[values]}, sid)

          if(res && res.error){
            uplLog(`  [${i+1}/${rows.length}] ${dateStr} → ERROR: ${res.error.message}`, true)
            totalErrors++
          } else {
            uplLog(`  [${i+1}/${rows.length}] ${dateStr} → Row ${rowNum} ✓`)
            totalWritten++
          }
        } catch(e){
          uplLog(`  [${i+1}/${rows.length}] ${dateStr} → ERROR: ${e.message}`, true)
          totalErrors++
        }
      }
      sheetsWritten.push(sName)

      // Write audit log entries for any last-3-days dates in this upload
      // so the audit matrix shows "Saved" instead of "Missing!" for uploaded dates
      if(totalWritten > 0){
        const sheetLabel = SHEETS.find(s=>s.id===cfg.cmKey)?.label || sName
        const last3 = _last3Days()
        const uploadedDates = new Set(rows.map(r=>r.dateStr))
        for(const d of last3){
          if(uploadedDates.has(d)){
            await appendSubmissionLog(toExcelSerial(d), sheetLabel, sid).catch(()=>{})
          }
        }
      }
    }

    uplLog(``)
    uplLog(`═ Done: ${totalWritten} written  ${totalSkipped} skipped  ${totalDupSkipped} dup-skipped  ${totalErrors} error${totalErrors===1?'':'s'} ═`)

    // Fix 2 + Fix 3: write UPLOAD COMPLETE to submission log with full summary
    const status = totalErrors === 0 ? 'COMPLETE' : `PARTIAL (${totalErrors} errors)`
    const endLabel = `[UPLOAD ${status}] ${_uplFile.name} | ${dateRangeStr} | written:${totalWritten} skipped:${totalSkipped+totalDupSkipped} errors:${totalErrors}`
    await appendSubmissionLog(allDates[0] ? toExcelSerial(allDates[0]) : 0, endLabel, sid).catch(()=>{})

    // Big result banner — unmissable
    if(logEl){
      const ok = totalErrors === 0
      const banner = document.createElement('div')
      banner.style.cssText = `margin-top:10px;padding:12px 16px;border-radius:8px;font-weight:700;font-size:.9rem;text-align:center;background:${ok?'#dcfce7':'#fef2f2'};color:${ok?'#166534':'#991b1b'};border:1.5px solid ${ok?'#86efac':'#fca5a5'}`
      banner.textContent = ok
        ? `✅ Done — ${totalWritten} row${totalWritten===1?'':'s'} written to master workbook`
        : `❌ ${totalErrors} error${totalErrors===1?'':'s'} — scroll up to see details. ${totalWritten} rows written.`
      logEl.appendChild(banner)
      banner.scrollIntoView({behavior:'smooth',block:'nearest'})
    }
    if(totalErrors === 0) toast(`Transfer complete — ${totalWritten} row${totalWritten===1?'':'s'} written to master workbook`)
    else toast(`Transfer done with ${totalErrors} error${totalErrors===1?'':'s'} — see log`, true)

  } catch(e){
    if(logEl){
      const banner = document.createElement('div')
      banner.style.cssText = 'margin-top:10px;padding:12px 16px;border-radius:8px;font-weight:700;font-size:.9rem;text-align:center;background:#fef2f2;color:#991b1b;border:1.5px solid #fca5a5'
      banner.textContent = `❌ Upload failed: ${e.message}`
      logEl.appendChild(banner)
      banner.scrollIntoView({behavior:'smooth',block:'nearest'})
    }
    // Fix 2: log failure state so partial writes are traceable
    uplLog(`Fatal: ${e.message}`, true)
    const sid2 = await getSession().catch(()=>null)
    if(sid2){
      const failLabel = `[UPLOAD FAILED] ${_uplFile.name} | ${dateRangeStr} | sheets completed before failure: ${sheetsWritten.join(', ')||'none'} | error: ${e.message}`
      await appendSubmissionLog(allDates[0] ? toExcelSerial(allDates[0]) : 0, failLabel, sid2).catch(()=>{})
    }
    toast(`Upload failed: ${e.message}`, true)
  } finally {
    if(btn){ btn.disabled=false; btn.textContent='Upload Again' }
  }
}

window.showUploadView = showUploadView
window.onUplDrop = onUplDrop
window.onUplFileSelect = onUplFileSelect
window.submitUpload = submitUpload
</script>
